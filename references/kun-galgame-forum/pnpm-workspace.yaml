packages:
  - "apps/*"
  - "packages/*"

# Settings live here, not in package.json: pnpm 10.12 no longer reads the
# manifest's "pnpm" field and silently ignores whatever it holds.
#
# overrides is NOT legacy cruft. The @milkdown/* set must resolve to ONE
# version, and prosemirror-model to a single instance — two copies of it in
# the graph is the classic ProseMirror duplicate-instance failure that breaks
# the editor at runtime. The lockfile records these, so dropping them is what
# made `pnpm install --frozen-lockfile` fail in CI.
overrides:
  '@nuxt/schema': '4.4.7'
  'is-arguments': 'npm:@nolyfill/is-arguments@^1'
  'is-core-module': 'npm:@nolyfill/is-core-module@^1'
  'is-generator-function': 'npm:@nolyfill/is-generator-function@^1'
  'is-typed-array': 'npm:@nolyfill/is-typed-array@^1'
  'isarray': 'npm:@nolyfill/isarray@^1'
  'safe-buffer': 'npm:@nolyfill/safe-buffer@^1'
  'safer-buffer': 'npm:@nolyfill/safer-buffer@^1'
  'string.prototype.matchall': 'npm:@nolyfill/string.prototype.matchall@^1'
  'which-typed-array': 'npm:@nolyfill/which-typed-array@^1'
  'prosemirror-model': '1.25.3'
  '@milkdown/components': '7.21.2'
  '@milkdown/core': '7.21.2'
  '@milkdown/ctx': '7.21.2'
  '@milkdown/exception': '7.21.2'
  '@milkdown/kit': '7.21.2'
  '@milkdown/plugin-block': '7.21.2'
  '@milkdown/plugin-clipboard': '7.21.2'
  '@milkdown/plugin-cursor': '7.21.2'
  '@milkdown/plugin-history': '7.21.2'
  '@milkdown/plugin-indent': '7.21.2'
  '@milkdown/plugin-listener': '7.21.2'
  '@milkdown/plugin-slash': '7.21.2'
  '@milkdown/plugin-tooltip': '7.21.2'
  '@milkdown/plugin-trailing': '7.21.2'
  '@milkdown/plugin-upload': '7.21.2'
  '@milkdown/preset-commonmark': '7.21.2'
  '@milkdown/preset-gfm': '7.21.2'
  '@milkdown/prose': '7.21.2'
  '@milkdown/transformer': '7.21.2'
  '@milkdown/utils': '7.21.2'
  'vue-router': '5.0.4'

# pnpm 10 blocks dependency build scripts unless they are allow-listed here.
# CI installs with --ignore-scripts so the image does not need these, but a
# plain local `pnpm install` does.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'aws-sdk'
  - 'bcrypt'
  - 'better-sqlite3'
  - 'esbuild'
  - 'sharp'
  - 'unrs-resolver'
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - 'puppeteer'
  - 'vue-demi'

# ─────────────────────────────────────────────────────────────
# KV 实验 worker（launch-path 对照实验；由 CI 的 deploy_kv_experiment 手动开关触发）
# 与生产 worker campus-wall-api（D1）互不影响：独立 name、独立 secret。
# 无 D1 绑定 → src/db.py 自动选择 KV 后端（src/_kv.py 分片快照）。
# 首次请求 bootstrap 探针发现空库 → 自动建分片并播种。
# JWT_SECRET 为本 worker 独立 secret（CI 步骤会用 JWT_SECRET_PROD 自动 put）。
# ─────────────────────────────────────────────────────────────
name = "campus-wall-api-kv"
main = "src/entry.py"
compatibility_date = "2026-08-11"
compatibility_flags = ["python_workers", "disable_python_external_sdk"]

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_KV_ID"

[vars]
JWT_EXPIRATION_DAYS = "30"

# CampusWall Nginx 入口：uploads/静态直出 + gzip + 反代 gunicorn(app:8000)
# 上传文件放最前（正则 location 优先级最高，零代理开销）

# 静态响应缓存区（本文件被 include 进 http 上下文，可在此声明）
proxy_cache_path /var/cache/nginx/campuswall_static levels=1:2 keys_zone=campuswall_static:10m
                 max_size=200m inactive=6h use_temp_path=off;

upstream campuswall_app {
    server app:8000;
    keepalive 16;
}

# 站点无 www 时自动补全（按需启用第二个 server；默认仅按 IP/裸域名访问）
server {
    listen 80;
    server_name _;

    client_max_body_size 16m;             # 与 Flask MAX_CONTENT_LENGTH 对齐
    charset utf-8;

    access_log /var/log/nginx/campuswall.access.log;
    error_log  /var/log/nginx/campuswall.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/html;
    gzip_min_length 1024;

    # ACME 证书校验（certbot webroot 模式）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── 用户上传文件：volume 直出，长缓存（文件名含随机串，可安全 immutable）──
    location ^~ /static/uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── 应用静态（css/js/图片/字体）：同样 volume 直出，中等缓存 ──
    location ^~ /static/ {
        proxy_pass http://campuswall_app;
        proxy_set_header Host $host;
        proxy_cache campuswall_static;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
        expires 6h;
    }

    # ── API：不缓存，透传真实 IP ──
    location /api/ {
        proxy_pass http://campuswall_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── 页面 HTML：经 Flask 路由矩阵，no-cache（含 ETag，前端秒开）──
    location / {
        proxy_pass http://campuswall_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

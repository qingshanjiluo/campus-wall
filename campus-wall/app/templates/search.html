{% extends "base.html" %}
{% block title %}搜索 · 校园墙{% endblock %}

{% block content %}
<div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:800px;">
        <div class="section-header reveal">
            <h2 class="chapter-title">🔍 搜索</h2>
            <p class="chapter-sub">搜索子站，找到你的圈子</p>
        </div>
        <div class="search-box reveal" style="margin-bottom:32px;">
            <span class="search-icon">🔍</span>
            <input class="input" type="text" id="globalSearch" placeholder="搜索子站..." autofocus>
        </div>
        <div id="searchResults"></div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    debouncedSearch('globalSearch', function(q) {
        const results = document.getElementById('searchResults');
        if (!q) { results.innerHTML = ''; return; }
        results.innerHTML = '<div class="loading">搜索中</div>';
        api.get('/api/stations/search?q=' + encodeURIComponent(q)).then(data => {
            if (data.length === 0) {
                results.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div class="text">没有找到「'+escHtml(q)+'」相关子站</div></div>';
                return;
            }
            results.innerHTML = '<p style="margin-bottom:16px;color:var(--text-muted);font-size:0.9rem;">找到 '+data.length+' 个结果</p><div class="station-grid">' + data.map(s => `
                <div class="station-card" onclick="window.location.href='/station/${s.id}'">
                    <div class="station-card-header">
                        <div class="station-icon">${s.icon||'🏫'}</div>
                        <div class="name">${escHtml(s.name)}</div>
                    </div>
                    <div class="desc">${escHtml(s.description||'')}</div>
                    <div class="meta"><span>👥 ${s.user_count||0}</span><span>📝 ${s.post_count||0}</span></div>
                </div>
            `).join('') + '</div>';
            initReveal();
        }).catch(() => results.innerHTML = '<div class="empty-state"><div class="icon">😢</div><div class="text">搜索失败</div></div>');
    }, 300);
});
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}重置密码 · 校园墙{% endblock %}

{% block content %}
<div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:480px;">
        <div class="speech-bubble reveal" style="position:relative;">
            <h2 class="chapter-title" style="font-size:1.5rem;margin-bottom:20px;">🔑 重置密码</h2>
            <form id="resetPasswordForm" onsubmit="return handleResetPassword(event)">
                <input type="hidden" name="token" id="resetTokenInput">
                <div class="form-group">
                    <label class="form-label">新密码</label>
                    <input class="input" type="password" name="new_password" placeholder="至少6个字符" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">确认新密码</label>
                    <input class="input" type="password" name="confirm_password" placeholder="再次输入新密码" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;">重置密码</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
        showToast('缺少重置令牌', 'error');
    } else {
        document.getElementById('resetTokenInput').value = token;
    }
});

function handleResetPassword(e) {
    e.preventDefault();
    const form = e.target;
    const token = form.token.value;
    const newPw = form.new_password.value;
    const confirmPw = form.confirm_password.value;
    if (!token) { showToast('缺少重置令牌', 'error'); return false; }
    if (newPw !== confirmPw) { showToast('两次密码不一致', 'error'); return false; }
    api.post('/api/auth/reset-password', { token, new_password: newPw })
        .then(res => {
            showToast(res.message, 'success');
            setTimeout(() => window.location.href = '/', 1500);
        })
        .catch(err => showToast(err.message || '重置失败', 'error'));
    return false;
}
</script>
{% endblock %}

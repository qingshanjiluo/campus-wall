<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:1100px;">
        <div style="display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;" id="profileLayout">
            <!-- 左侧个人信息 -->
            <aside>
                <div class="profile-card reveal" id="profileCard">
                    <div class="loading">加载中</div>
                </div>
            </aside>

            <!-- 右侧内容 -->
            <div>
                <!-- 标签切换 -->
                <div class="tag-bar reveal" id="profileTabs">
                    <span class="tag active" onclick="switchProfileTab(this,'posts')"><i data-lucide="file-text" class="icon icon-sm"></i> 帖子</span>
                    <span class="tag" onclick="switchProfileTab(this,'stations')"><i data-lucide="building-2" class="icon icon-sm"></i> 子站</span>
                    <span class="tag" onclick="switchProfileTab(this,'likes')"><i data-lucide="heart" class="icon icon-sm"></i> 赞过</span>
                    <span class="tag" onclick="switchProfileTab(this,'favorites')"><i data-lucide="bookmark" class="icon icon-sm"></i> 收藏</span>
                    <span class="tag" onclick="switchProfileTab(this,'followers')"><i data-lucide="users" class="icon icon-sm"></i> 粉丝</span>
                    <span class="tag" onclick="switchProfileTab(this,'following')"><i data-lucide="user-plus" class="icon icon-sm"></i> 关注</span>
                </div>
                <div id="profileContent"><div class="loading">加载中</div></div>
            </div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
const PROFILE_UID = parseInt(window.location.pathname.split("/")[2], 10) || 1;
let profileData = null;
let currentProfileTab = 'posts';

onUserReady(function() {
    loadProfile();
    loadProfileTab('posts');
});

function loadProfile() {
    api.get('/api/auth/user/' + PROFILE_UID).then(data => {
        profileData = data;
        renderProfileCard(data);
        document.title = data.username + ' · 校园墙';
    }).catch(() => {
        document.getElementById('profileCard').innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="frown" class="icon icon-lg"></i></div><div class="text">用户不存在</div></div>';
        if (window.lucide) lucide.createIcons();
    });
}

function renderProfileCard(u) {
    const isMe = currentUser && currentUser.id === u.id;
    const stats = u.stats || {};
    let followBtn = '';
    if (!isMe && currentUser) {
        followBtn = `<button class="btn btn-primary btn-sm" id="followBtn" onclick="toggleFollow(${u.id})" style="margin-top:12px;"><i data-lucide="user-plus" class="icon icon-sm"></i> 关注</button>`;
        checkFollowing(u.id);
    }
    const badges = [];
    if (u.identity_group) badges.push('<span class="profile-badge" style="background:var(--lavender);"><i data-lucide="shield" class="icon icon-sm"></i> '+escHtml(u.identity_group)+'</span>');
    if (u.title) badges.push('<span class="profile-badge" style="background:var(--yellow);"><i data-lucide="award" class="icon icon-sm"></i> '+escHtml(u.title)+'</span>');
    if (u.mood) badges.push('<span class="profile-badge" style="background:var(--mint);"><i data-lucide="smile" class="icon icon-sm"></i> '+escHtml(u.mood)+'</span>');
    document.getElementById('profileCard').innerHTML = `
        <div class="avatar-container">
            <div class="avatar-ring"></div>
            <img class="avatar" src="${safeUrl(u.avatar, '/static/images/default-avatar.svg')}" alt="" onerror="this.src='/static/images/default-avatar.svg'">
        </div>
        <div class="profile-name">${escHtml(u.username)}</div>
        ${badges.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:6px;">'+badges.join('')+'</div>' : ''}
        ${u.bio ? '<div class="profile-bio">'+escHtml(u.bio)+'</div>' : ''}
        <div class="profile-assets" style="display:flex;justify-content:center;gap:18px;margin:12px 0;">
            <div style="text-align:center;"><div style="font-weight:800;color:var(--orange);font-size:1.05rem;"><i data-lucide="coins" class="icon icon-sm"></i> ${u.coins||0}</div><div style="font-size:0.7rem;color:var(--text-muted);">金币</div></div>
            <div style="text-align:center;"><div style="font-weight:800;color:var(--mint);font-size:1.05rem;"><i data-lucide="star" class="icon icon-sm"></i> ${u.points||0}</div><div style="font-size:0.7rem;color:var(--text-muted);">积分</div></div>
            <div style="text-align:center;"><div style="font-weight:800;color:var(--pink-4);font-size:1.05rem;">Lv.${u.level||1}</div><div style="font-size:0.7rem;color:var(--text-muted);">等级</div></div>
            <div style="text-align:center;"><div style="font-weight:800;color:var(--blue);font-size:1.05rem;"><i data-lucide="flame" class="icon icon-sm"></i> ${u.checkin_streak||0}</div><div style="font-size:0.7rem;color:var(--text-muted);">连续签到</div></div>
        </div>
        <div class="level-progress-wrap">
            ${(() => {
                const level = u.level || 1;
                const xp = (u.exp !== undefined ? u.exp : (u.experience || 0)) || 0;
                const xpNeeded = level * 100;
                const pct = Math.min(100, Math.round((xp / xpNeeded) * 100));
                return '<div class="level-progress-bar"><div class="level-progress-fill" style="width:' + pct + '%;"></div></div>' +
                    '<div class="level-progress-text">' + xp + ' / ' + xpNeeded + ' EXP · 下一级 Lv.' + (level + 1) + '</div>';
            })()}
        </div>
        <div class="profile-stats">
            <div class="stat-item"><div class="stat-num">${stats.posts||0}</div><div class="stat-label">帖子</div></div>
            <div class="stat-item"><div class="stat-num">${stats.followers||0}</div><div class="stat-label">粉丝</div></div>
            <div class="stat-item"><div class="stat-num">${stats.following||0}</div><div class="stat-label">关注</div></div>
        </div>
        ${isMe ? '<button class="btn btn-sm" onclick="openEditProfile()" style="margin-top:12px;"><i data-lucide="pencil" class="icon icon-sm"></i> 编辑资料</button>' : ''}
        ${followBtn}
    `;
    if (window.lucide) lucide.createIcons();
}

function checkFollowing(uid) {
    if (!currentUser) return;
    api.get('/api/social/is-following/' + uid).then(data => {
        const btn = document.getElementById('followBtn');
        if (btn) {
            btn.textContent = data.following ? '已关注' : '关注';
            btn.className = data.following ? 'btn btn-sm' : 'btn btn-primary btn-sm';
        }
    }).catch(() => {});
}

function toggleFollow(uid) {
    if (!requireAuth()) return;
    api.post('/api/social/follow/' + uid).then(data => {
        showToast(data.message, data.following ? 'success' : '');
        const btn = document.getElementById('followBtn');
        if (btn) {
            btn.textContent = data.following ? '已关注' : '关注';
            btn.className = data.following ? 'btn btn-sm' : 'btn btn-primary btn-sm';
        }
        loadProfile();
    }).catch(e => showToast(e.message || '操作失败', 'error'));
}

function switchProfileTab(el, tab) {
    document.querySelectorAll('#profileTabs .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentProfileTab = tab;
    loadProfileTab(tab);
}

function loadProfileTab(tab) {
    const content = document.getElementById('profileContent');
    content.innerHTML = '<div class="loading">加载中</div>';
    if (tab === 'posts') {
        api.get('/api/posts?author_id=' + PROFILE_UID + '&limit=50').then(data => {
            if (!data.posts || data.posts.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="file-text" class="icon icon-lg"></i></div><div class="text">还没有发过帖子</div></div>';
                return;
            }
            content.innerHTML = data.posts.map(p => renderPostCard(p)).join('');
            initReveal();
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'stations') {
        api.get('/api/stations/mine').then(stations => {
            if (!stations.length) {
                content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="building-2" class="icon icon-lg"></i></div><div class="text">还没有加入任何子站</div></div>';
                if (window.lucide) lucide.createIcons();
                return;
            }
            content.innerHTML = '<div class="station-grid">' + stations.map(s => `
                <div class="station-card reveal" onclick="window.location.href='/station/${s.id}'">
                    <div class="station-card-header">
                        <div class="station-icon"><i data-lucide="${getStationIcon(s.icon)}" class="icon icon-lg"></i></div>
                        <div class="name">${escHtml(s.name)} ${s.role==='owner'?'<span class="profile-badge" style="background:var(--yellow);"><i data-lucide="crown" class="icon icon-sm"></i> 站长</span>':''}</div>
                    </div>
                    <div class="desc">${escHtml(s.description||'暂无简介')}</div>
                    <div class="meta"><span><i data-lucide="users" class="icon icon-sm"></i> ${s.user_count||0}</span><span><i data-lucide="file-text" class="icon icon-sm"></i> ${s.post_count||0}</span></div>
                </div>
            `).join('') + '</div>';
            initReveal();
            if (window.lucide) lucide.createIcons();
        }).catch(() => {
            content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="cloud-off" class="icon icon-lg"></i></div><div class="text">加载失败</div></div>';
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'likes') {
        if (!currentUser || currentUser.id !== PROFILE_UID) {
            content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="lock" class="icon icon-lg"></i></div><div class="text">仅自己可见</div></div>';
            if (window.lucide) lucide.createIcons();
            return;
        }
        api.get('/api/posts/liked').then(res => {
            const items = res.posts || [];
            if (items.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="heart" class="icon icon-lg"></i></div><div class="text">还没有赞过的帖子</div></div>';
                if (window.lucide) lucide.createIcons();
                return;
            }
            content.innerHTML = items.map(p => renderPostCard(p)).join('');
            initReveal();
            if (window.lucide) lucide.createIcons();
        }).catch(() => {
            content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="cloud-off" class="icon icon-lg"></i></div><div class="text">加载失败</div></div>';
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'favorites') {
        if (!currentUser || currentUser.id !== PROFILE_UID) {
            content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="lock" class="icon icon-lg"></i></div><div class="text">仅自己可见</div></div>';
            if (window.lucide) lucide.createIcons();
            return;
        }
        api.get('/api/favorites?type=post&limit=50').then(res => {
            const items = res.items || [];
            if (items.length === 0) {
                content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="bookmark" class="icon icon-lg"></i></div><div class="text">还没有收藏任何帖子</div></div>';
                if (window.lucide) lucide.createIcons();
                return;
            }
            content.innerHTML = items.map(p => renderPostCard(p)).join('');
            initReveal();
            if (window.lucide) lucide.createIcons();
        }).catch(() => {
            content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="cloud-off" class="icon icon-lg"></i></div><div class="text">加载失败</div></div>';
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'followers') {
        api.get('/api/social/followers/' + PROFILE_UID).then(data => renderUserList(content, data));
    } else if (tab === 'following') {
        api.get('/api/social/following/' + PROFILE_UID).then(data => renderUserList(content, data));
    }
}

function renderUserList(container, users) {
    if (!users || users.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="users" class="icon icon-lg"></i></div><div class="text">暂无</div></div>';
        return;
    }
    container.innerHTML = users.map(u => `
        <div class="post-card reveal" onclick="window.location.href='/profile/${u.id}'" style="padding:16px;">
            <div style="display:flex;align-items:center;gap:12px;">
                <img src="${safeUrl(u.avatar, '/static/images/default-avatar.svg')}" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--glass-border);" onerror="this.src='/static/images/default-avatar.svg'">
                <div>
                    <div style="font-weight:600;font-size:0.9rem;">${escHtml(u.username)}</div>
                    <div style="font-size:0.8rem;color:var(--text-muted);">${escHtml(u.bio||'')}</div>
                </div>
            </div>
        </div>
    `).join('');
    initReveal();
    if (window.lucide) lucide.createIcons();
}
</script>

<style>
@media (max-width: 768px) {
    #profileLayout { grid-template-columns: 1fr !important; }
}
</style>
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园墙 · 连接校园 分享青春</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
<!-- Hero -->
<section class="hero-section" id="hero">
    <div class="giant-deco" style="top:8%;left:-8%;opacity:0.08;">
        <i data-lucide="sparkles" style="width:100%;height:100%;color:var(--primary);"></i>
    </div>
    <div class="giant-deco" style="bottom:5%;right:-5%;opacity:0.06;">
        <i data-lucide="heart" style="width:80%;height:80%;color:var(--secondary);"></i>
    </div>
    <h1>连接校园<br>分享青春</h1>
    <p>创建属于你的校园墙，让每一个声音都被听见</p>
    <div class="hero-btns">
        <button class="btn btn-primary btn-lg" onclick="requireAuth() && openModal('createPostModal')">
            <i data-lucide="pencil" class="icon icon-md"></i> 发帖
        </button>
        <button class="btn btn-lg" onclick="document.getElementById('stations').scrollIntoView({behavior:'smooth'})">
            <i data-lucide="arrow-down" class="icon icon-md"></i> 浏览子站
        </button>
    </div>
    <div class="scroll-hint">
        <span class="scroll-hint-text">向下滚动探索</span>
        <div class="scroll-hint-arrow"><i data-lucide="chevrons-down" class="icon icon-lg"></i></div>
    </div>
</section>

<div class="section-divider"><div class="divider-line"></div><div class="divider-ornament"><i data-lucide="flower-2" class="icon icon-lg"></i></div></div>

<!-- 子站市场 -->
<section class="section" id="stations">
    <div class="container" style="max-width:1100px;">
        <div class="section-header reveal">
            <h2 class="chapter-title">子站市场</h2>
            <p class="chapter-sub">发现更多有趣的角落，找到属于你的同好圈子</p>
        </div>
        <div class="search-box reveal" style="margin-bottom:24px;">
            <i data-lucide="search" class="icon search-icon"></i>
            <input class="input" type="text" id="searchInput" placeholder="搜索感兴趣的子站...">
        </div>
        <div class="tag-bar reveal" id="tagBar">
            <span class="tag active" onclick="filterByTag(this, '')"><i data-lucide="flame" class="icon icon-sm"></i> 全部</span>
            <span class="tag" onclick="filterByTag(this, '情感')"><i data-lucide="heart" class="icon icon-sm"></i> 情感</span>
            <span class="tag" onclick="filterByTag(this, '学习')"><i data-lucide="book-open" class="icon icon-sm"></i> 学习</span>
            <span class="tag" onclick="filterByTag(this, '美食')"><i data-lucide="utensils" class="icon icon-sm"></i> 美食</span>
            <span class="tag" onclick="filterByTag(this, '摄影')"><i data-lucide="camera" class="icon icon-sm"></i> 摄影</span>
            <span class="tag" onclick="filterByTag(this, '运动')"><i data-lucide="activity" class="icon icon-sm"></i> 运动</span>
            <span class="tag" onclick="filterByTag(this, '音乐')"><i data-lucide="music" class="icon icon-sm"></i> 音乐</span>
            <span class="tag" onclick="filterByTag(this, '社团')"><i data-lucide="users" class="icon icon-sm"></i> 社团</span>
        </div>
        <div id="stationGrid" class="station-grid">
            <div class="loading">加载中</div>
        </div>
    </div>
</section>

<div class="section-divider"><div class="divider-line"></div><div class="divider-ornament" style="animation-delay:-1.5s;"><i data-lucide="leaf" class="icon icon-lg"></i></div></div>

<!-- 最新动态 -->
<section class="section" id="posts" style="padding-bottom:100px;">
    <div class="container" style="max-width:800px;">
        <div class="section-header reveal">
            <h2 class="chapter-title">最新动态</h2>
            <p class="chapter-sub">看看大家都在聊些什么</p>
        </div>
        <div class="tag-bar reveal" id="postSortBar">
            <span class="tag active" onclick="sortPosts(this, 'newest')"><i data-lucide="clock" class="icon icon-sm"></i> 最新</span>
            <span class="tag" onclick="sortPosts(this, 'popular')"><i data-lucide="trending-up" class="icon icon-sm"></i> 热门</span>
            <span class="tag" onclick="sortPosts(this, 'comments')"><i data-lucide="message-circle" class="icon icon-sm"></i> 最多评论</span>
        </div>
        <div id="postList">
            <div class="loading">加载中</div>
        </div>
        <div style="text-align:center;margin-top:32px;">
            <button class="btn" id="loadMoreBtn" onclick="loadMorePosts()" style="display:none;">
                <i data-lucide="arrow-down" class="icon icon-sm"></i> 加载更多
            </button>
        </div>
    </div>
</section>
    </main>
</div>
<script>
let currentPostSort = 'newest';
let postOffset = 0;
const postLimit = 10;

onUserReady(function() {
    loadStations();
    loadPosts();
    debouncedSearch('searchInput', function(q) {
        if (!q) { loadStations(); return; }
        api.get('/api/stations/search?q=' + encodeURIComponent(q)).then(data => renderStations(data)).catch(() => CampusUtils.showToast('搜索失败','error'));
    });
    document.addEventListener('postCreated', () => loadPosts());
});

function loadStations(tag) {
    const grid = document.getElementById('stationGrid');
    grid.innerHTML = '<div class="loading">加载中</div>';
    let url = '/api/stations?limit=20';
    if (tag) url += '&tag=' + encodeURIComponent(tag);
    api.get(url)
        .then(data => renderStations(data))
        .catch(() => { grid.innerHTML = '<div class="empty-state"><i data-lucide="cloud-off" class="icon empty-icon"></i><div class="text">加载失败，刷新试试</div></div>'; if(typeof lucide!=='undefined') lucide.createIcons(); });
}

function renderStations(stations) {
    const grid = document.getElementById('stationGrid');
    if (!stations || stations.length === 0) {
        grid.innerHTML = '<div class="empty-state"><i data-lucide="building-2" class="icon empty-icon"></i><div class="text">还没有子站，来创建第一个吧！</div></div>';
        if(typeof lucide!=='undefined') lucide.createIcons();
        return;
    }
    grid.innerHTML = stations.map(s => `
        <div class="station-card reveal" onclick="window.location.href='/station/${s.id}'">
            ${s.cover ? '<div class="station-cover" style="background-image:url(\'' + s.cover + '\')"></div>' : ''}
            <div class="station-card-header">
                <div class="station-icon"><i data-lucide="${s.icon || 'school'}" class="icon icon-lg"></i></div>
                <div class="name">${escHtml(s.name)}</div>
            </div>
            <div class="desc">${escHtml(s.description || '暂无简介')}</div>
            <div class="tags">${(s.tags||[]).map(t => '<span class="tag">#' + escHtml(t) + '</span>').join('')}</div>
            <div class="meta">
                <span><i data-lucide="users" class="icon icon-sm"></i> ${s.user_count||0}</span>
                <span><i data-lucide="file-text" class="icon icon-sm"></i> ${s.post_count||0}</span>
            </div>
        </div>
    `).join('');
    if(typeof lucide!=='undefined') lucide.createIcons();
    initReveal();
}

function filterByTag(el, tag) {
    document.querySelectorAll('#tagBar .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    loadStations(tag);
}

function loadPosts(append) {
    if (!append) postOffset = 0;
    const list = document.getElementById('postList');
    if (!append) list.innerHTML = '<div class="loading">加载中</div>';
    api.get('/api/posts?limit=' + postLimit + '&offset=' + postOffset + '&sort=' + currentPostSort)
        .then(data => {
            renderPosts(data.posts, append);
            const btn = document.getElementById('loadMoreBtn');
            if (data.posts.length >= postLimit) {
                btn.style.display = '';
                postOffset += postLimit;
            } else {
                btn.style.display = 'none';
            }
        })
        .catch(() => { if (!append) { list.innerHTML = '<div class="empty-state"><i data-lucide="cloud-off" class="icon empty-icon"></i><div class="text">加载失败</div></div>'; if(typeof lucide!=='undefined') lucide.createIcons(); } });
}

function renderPosts(posts, append) {
    const list = document.getElementById('postList');
    if (!posts || posts.length === 0) {
        if (!append) { list.innerHTML = '<div class="empty-state"><i data-lucide="file-text" class="icon empty-icon"></i><div class="text">还没有帖子，来发第一帖吧！</div></div>'; if(typeof lucide!=='undefined') lucide.createIcons(); }
        return;
    }
    const html = posts.map(p => renderPostCard(p)).join('');
    if (append) {
        list.insertAdjacentHTML('beforeend', html);
    } else {
        list.innerHTML = html;
    }
    if(typeof lucide!=='undefined') lucide.createIcons();
    initReveal();
}

function sortPosts(el, sort) {
    document.querySelectorAll('#postSortBar .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentPostSort = sort;
    loadPosts();
}

function loadMorePosts() {
    loadPosts(true);
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:800px;">
        <div class="section-header reveal">
            <h2 class="chapter-title"><i data-lucide="search" class="icon icon-lg"></i> 搜索</h2>
            <p class="chapter-sub">搜索子站、帖子与用户</p>
        </div>
        <div class="search-box reveal" style="margin-bottom:32px;">
            <i data-lucide="search" class="icon search-icon"></i>
            <input class="input" type="text" id="globalSearch" placeholder="搜索子站 / 帖子 / 用户..." autofocus>
        </div>
        <!-- 搜索历史 -->
        <div id="searchHistorySection" style="margin-bottom:24px;display:none;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <h3 style="font-family:'ZCOOL KuaiLe',cursive;font-size:1rem;margin:0;"><i data-lucide="history" class="icon icon-sm"></i> 搜索历史</h3>
                <button class="btn btn-sm" onclick="clearSearchHistory()"><i data-lucide="trash-2" class="icon icon-sm"></i> 清空</button>
            </div>
            <div id="searchHistoryList" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
        </div>
        <!-- 热搜话题榜 -->
        <div id="trendingSection" style="margin-bottom:24px;">
            <h3 style="font-family:'ZCOOL KuaiLe',cursive;font-size:1rem;margin:0 0 10px;"><i data-lucide="flame" class="icon icon-sm icon-danger"></i> 热搜话题</h3>
            <div id="trendingList" class="trending-list"></div>
        </div>
        <div id="searchResults"></div>
    </div>
</div>
    </main>
</div>
<script>
const SEARCH_HISTORY_KEY = 'campuswall_search_history';
const SEARCH_HISTORY_MAX = 10;

document.addEventListener('DOMContentLoaded', function() {
    renderSearchHistory();
    loadTrending();
    const topicParam = new URLSearchParams(window.location.search).get('topic');
    if (topicParam) { renderTopicView(topicParam); return; }
    const searchInput = document.getElementById('globalSearch');
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && this.value.trim()) {
            addSearchHistory(this.value.trim());
            renderSearchHistory();
        }
    });
    debouncedSearch('globalSearch', function(q) {
        setTrendingVisible(!q);
        if (q && q.trim()) {
            addSearchHistory(q.trim());
            renderSearchHistory();
        }
        const results = document.getElementById('searchResults');
        if (!q) { results.innerHTML = ''; return; }
        results.innerHTML = '<div class="loading">搜索中</div>';
        api.get('/api/recommend/search?q=' + encodeURIComponent(q)).then(data => {
            data = data || { stations: [], posts: [], users: [] };
            const total = (data.stations||[]).length + (data.posts||[]).length + (data.users||[]).length;
            if (total === 0) {
                results.innerHTML = '<div class="empty-state"><i data-lucide="search-x" class="icon empty-icon"></i><div class="text">没有找到「' + CampusUtils.escHtml(q) + '」相关的内容</div></div>';
                if(typeof lucide!=='undefined') lucide.createIcons();
                return;
            }
            let html = '<p style="margin-bottom:16px;color:var(--text-muted);font-size:0.9rem;">共找到 ' + total + ' 个结果</p>';

            // 子站结果
            if (data.stations && data.stations.length) {
                html += '<h3 style="font-family:\'ZCOOL KuaiLe\',cursive;margin:20px 0 12px;"><i data-lucide="building-2" class="icon icon-md"></i> 子站 (' + data.stations.length + ')</h3><div class="station-grid">' + data.stations.map(s => {
                    return '<div class="station-card" onclick="window.location.href=\'/station/' + s.id + '\'">' +
                        '<div class="station-card-header">' +
                        '<div class="station-icon"><i data-lucide="' + getStationIcon(s.icon) + '" class="icon icon-lg"></i></div>' +
                        '<div class="name">' + CampusUtils.escHtml(s.name) + '</div>' +
                        '</div>' +
                        '<div class="desc">' + CampusUtils.escHtml(s.description || '') + '</div>' +
                        '<div class="meta"><span><i data-lucide="users" class="icon icon-sm"></i> ' + (s.user_count || 0) + '</span><span><i data-lucide="file-text" class="icon icon-sm"></i> ' + (s.post_count || 0) + '</span></div>' +
                        '</div>';
                }).join('') + '</div>';
            }

            // 帖子结果
            if (data.posts && data.posts.length) {
                html += '<h3 style="font-family:\'ZCOOL KuaiLe\',cursive;margin:24px 0 12px;"><i data-lucide="file-text" class="icon icon-md"></i> 帖子 (' + data.posts.length + ')</h3>';
                html += data.posts.map(p => {
                    return '<article class="post-card reveal" onclick="window.location.href=\'/post/' + p.id + '\'">' +
                        '<div class="post-header">' +
                        '<img class="post-avatar" src="' + CampusUtils.safeUrl(p.author_avatar, '/static/images/default-avatar.svg') + '" alt="" onerror="this.src=\'/static/images/default-avatar.svg\'">' +
                        '<div class="post-meta">' +
                        '<div class="post-author">' + CampusUtils.escHtml(p.author_name) + '</div>' +
                        '<div class="post-time">' + CampusUtils.formatTime(p.created_at) + '</div>' +
                        '</div>' +
                        '<span class="post-station"><i data-lucide="' + getStationIcon(p.station_icon) + '" class="icon icon-sm"></i> ' + CampusUtils.escHtml(p.station_name || '') + '</span>' +
                        '</div>' +
                        '<div class="post-title">' + CampusUtils.escHtml(p.title) + '</div>' +
                        '<div class="post-content">' + renderContent(p.content, false) + '</div>' +
                        '</article>';
                }).join('');
            }

            // 用户结果
            if (data.users && data.users.length) {
                html += '<h3 style="font-family:\'ZCOOL KuaiLe\',cursive;margin:24px 0 12px;"><i data-lucide="users" class="icon icon-md"></i> 用户 (' + data.users.length + ')</h3>';
                html += data.users.map(u => {
                    return '<div class="post-card reveal" onclick="window.location.href=\'/profile/' + u.id + '\'">' +
                        '<div style="display:flex;align-items:center;gap:12px;">' +
                        '<img src="' + (u.avatar || '/static/images/default-avatar.svg') + '" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--border-primary);" onerror="this.src=\'/static/images/default-avatar.svg\'">' +
                        '<div>' +
                        '<div style="font-weight:600;font-size:0.9rem;">' + CampusUtils.escHtml(u.username) + '</div>' +
                        '<div style="font-size:0.8rem;color:var(--text-muted);">' + CampusUtils.escHtml(u.bio || '') + '</div>' +
                        '</div>' +
                        '</div>' +
                        '</div>';
                }).join('');
            }

            results.innerHTML = html;
            if(typeof lucide!=='undefined') lucide.createIcons();
            initReveal();
        }).catch(() => { results.innerHTML = '<div class="empty-state"><i data-lucide="cloud-off" class="icon empty-icon"></i><div class="text">搜索失败</div></div>'; if(typeof lucide!=='undefined') lucide.createIcons(); });
    }, 300);
});

function getSearchHistory() {
    try {
        return JSON.parse(localStorage.getItem(SEARCH_HISTORY_KEY) || '[]');
    } catch (e) {
        return [];
    }
}

function addSearchHistory(q) {
    if (!q) return;
    let history = getSearchHistory();
    history = history.filter(h => h !== q);
    history.unshift(q);
    if (history.length > SEARCH_HISTORY_MAX) history = history.slice(0, SEARCH_HISTORY_MAX);
    localStorage.setItem(SEARCH_HISTORY_KEY, JSON.stringify(history));
}

function clearSearchHistory() {
    localStorage.removeItem(SEARCH_HISTORY_KEY);
    renderSearchHistory();
}

function renderSearchHistory() {
    const section = document.getElementById('searchHistorySection');
    const list = document.getElementById('searchHistoryList');
    const history = getSearchHistory();
    if (history.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = '';
    list.innerHTML = history.map(h => `
        <span class="tag search-history-tag" onclick="useSearchHistory(this.dataset.h)" data-h="${CampusUtils.escHtml(h)}">
            <i data-lucide="history" class="icon icon-sm"></i> ${CampusUtils.escHtml(h)}
        </span>
    `).join('');
    if(typeof lucide!=='undefined') lucide.createIcons();
}

function useSearchHistory(q) {
    const input = document.getElementById('globalSearch');
    input.value = q;
    input.dispatchEvent(new Event('input'));
    renderSearchHistory();
}

function setTrendingVisible(v) {
    const s = document.getElementById('trendingSection');
    if (s) s.style.display = v ? '' : 'none';
}

function loadTrending() {
    api.get('/api/topics/trending?limit=10').then(list => {
        const box = document.getElementById('trendingList');
        if (!box) return;
        if (!list.length) { document.getElementById('trendingSection').style.display = 'none'; return; }
        box.innerHTML = list.map((t, i) => `
            <a class="trending-item" href="/search?topic=${encodeURIComponent(t.name)}">
                <span class="trending-rank ${i<3?'top':''}">${i+1}</span>
                <span class="trending-name"># ${escHtml(t.name)}</span>
                <span class="trending-count">${t.total} 帖</span>
            </a>`).join('');
    }).catch(() => {});
}

function renderTopicView(topic) {
    setTrendingVisible(false);
    const results = document.getElementById('searchResults');
    document.getElementById('globalSearch').value = '';
    results.innerHTML = '<div class="loading">加载中</div>';
    api.get('/api/topics/' + encodeURIComponent(topic) + '/posts?limit=30').then(data => {
        const posts = (data && data.posts) || [];
        if (!posts.length) {
            results.innerHTML = '<div class="empty-state"><i data-lucide="hash" class="icon empty-icon"></i><div class="text">话题「' + escHtml(topic) + '」下暂无内容</div></div>';
            if (typeof lucide !== 'undefined') lucide.createIcons();
            return;
        }
        results.innerHTML = '<h3 style="font-family:\'ZCOOL KuaiLe\',cursive;margin:0 0 14px;"><span class="topic-chip" style="font-size:1rem;padding:4px 14px;"># ' + escHtml(topic) + '</span> <span style="font-size:0.8rem;color:var(--text-muted);font-family:inherit;">共 ' + posts.length + ' 帖</span></h3>'
            + posts.map(renderPostCard).join('');
        if (typeof lucide !== 'undefined') lucide.createIcons();
        initReveal();
    }).catch(() => { results.innerHTML = '<div class="empty-state">加载失败</div>'; });
}
</script>
</body>
</html>

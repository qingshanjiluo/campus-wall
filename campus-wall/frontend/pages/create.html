<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发帖 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:600px;">
        <div class="speech-bubble reveal" style="position:relative;">
            <h2 class="chapter-title" style="font-size:1.5rem;margin-bottom:20px;"><i data-lucide="pencil" class="icon"></i> 发帖</h2>
            <form id="createPostPageForm" onsubmit="return handleCreatePostPage(event)">
                <div class="form-group">
                    <label class="form-label">选择子站</label>
                    <select class="input" name="station_id" id="pagePostStation" required>
                        <option value="">请选择子站...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input class="input" type="text" name="title" placeholder="给帖子起个标题" required>
                </div>
                <div class="form-group">
                    <label class="form-label">内容</label>
                    <textarea class="input" name="content" placeholder="说说你想分享的...（正文中 #话题 会自动识别）" required rows="8" maxlength="10000"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label"><i data-lucide="hash" class="icon icon-sm"></i> 话题（可选，最多 5 个，空格或逗号分隔）</label>
                    <input class="input" type="text" id="pagePostTopics" placeholder="如：#表白墙 食堂 失物招领" maxlength="120">
                </div>
                <div class="form-group">
                    <label class="form-label" style="cursor:pointer;"><i data-lucide="paperclip" class="icon icon-sm"></i> 上传图片（可选，最多 9 张）
                        <input type="file" accept="image/*" multiple onchange="uploadPostImages(this)" style="display:none;">
                    </label>
                    <div id="pageImagePreview" class="image-preview-grid"></div>
                </div>
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;font-size:0.85rem;color:var(--text-secondary);cursor:pointer;">
                        <input type="checkbox" name="is_anonymous" value="1"> <i data-lucide="venetian-mask" class="icon icon-sm"></i> 匿名发布（显示为"匿名用户"）
                    </label>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;"><i data-lucide="send" class="icon icon-sm"></i> 发布帖子</button>
            </form>
        </div>
    </div>
</div>
    </main>
</div>
<script>
onUserReady(function() {
    if (!requireAuth()) return;
    loadStationOptions('pagePostStation');
});

var pageImages = [];

function renderPageImages() {
    const box = document.getElementById('pageImagePreview');
    if (!box) return;
    box.innerHTML = pageImages.map((u, i) =>
        `<div class="image-preview-item"><img src="${CampusUtils.safeUrl(u, '')}" alt="">
            <button type="button" class="image-preview-remove" onclick="removePageImage(${i})" title="移除">&times;</button>
         </div>`).join('');
}

function removePageImage(i) {
    pageImages.splice(i, 1);
    renderPageImages();
}

function uploadPostImages(input) {
    const files = Array.from(input.files || []);
    if (!files.length) return;
    const room = 9 - pageImages.length;
    if (room <= 0) { showToast('最多上传 9 张图片', 'error'); input.value = ''; return; }
    const batch = files.slice(0, room);
    if (files.length > room) showToast('最多 9 张，多余已忽略', 'error');
    let done = 0;
    batch.forEach(file => {
        if (file.size > 5 * 1024 * 1024) { showToast(file.name + ' 超过 5MB，已跳过', 'error'); return; }
        const fd = new FormData();
        fd.append('file', file);
        fetch('/api/posts/upload-image', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + api.getToken() },
            body: fd
        }).then(r => r.json()).then(res => {
            done++;
            if (res.url) { pageImages.push(res.url); renderPageImages(); showToast('已上传 ' + done + '/' + batch.length, 'success'); }
            else showToast(res.error || '上传失败', 'error');
        }).catch(() => showToast('上传失败', 'error'));
    });
    input.value = '';
}

function collectTopics(form) {
    // 显式话题字段 + 正文内 #话题 标记 合并去重（后端仍会二次清洗/限 5）
    const explicit = (document.getElementById('pagePostTopics').value || '').split(/[,，\s]+/);
    const inline = [...(form.content.value.match(/#([\w\u4e00-\u9fa5]{1,20})/g) || [])].map(s => s.slice(1));
    const seen = new Set(); const out = [];
    [...explicit, ...inline].forEach(t => {
        const name = (t || '').trim().replace(/^#/, '');
        const k = name.toLowerCase();
        if (name && !seen.has(k)) { seen.add(k); out.push(name); }
    });
    return out.slice(0, 5);
}

function handleCreatePostPage(e) {
    e.preventDefault();
    const form = e.target;
    const data = {
        station_id: parseInt(form.station_id.value),
        title: form.title.value.trim(),
        content: form.content.value.trim(),
        is_anonymous: form.is_anonymous && form.is_anonymous.checked ? 1 : 0
    };
    if (pageImages.length) data.images = pageImages.slice();
    const topics = collectTopics(form);
    if (topics.length) data.topics = topics;
    if (!data.station_id || !data.title || !data.content) {
        showToast('请填写完整信息');
        return false;
    }
    api.post('/api/posts', data)
        .then(res => {
            if (res.status === 'pending') {
                showToast(res.message || '已提交，内容正在审核');
                setTimeout(() => { window.location.href = '/'; }, 1500);
                return;
            }
            showToast('发帖成功！');
            window.location.href = '/post/' + res.post.id;
        })
        .catch(err => showToast(err.message || '发帖失败'));
    return false;
}
</script>
</body>
</html>

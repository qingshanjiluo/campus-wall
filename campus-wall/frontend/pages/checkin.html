<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:600px;">
        <div class="speech-bubble reveal" style="text-align:center;">
            <div style="font-size:3rem;margin-bottom:8px;" id="checkinIcon">📅</div>
            <h2 class="chapter-title" style="font-size:2rem;" id="checkinTitle">每日签到</h2>
            <p class="chapter-sub" id="checkinSub">连续签到获得更多奖励</p>

            <div id="checkinStats" style="display:flex;justify-content:center;gap:24px;margin:24px 0;">
                <div><div class="stat-num" id="statStreak">0</div><div class="stat-label">连签天数</div></div>
                <div><div class="stat-num" id="statCoins">0</div><div class="stat-label">金币</div></div>
                <div><div class="stat-num" id="statPoints">0</div><div class="stat-label">积分</div></div>
            </div>

            <button class="btn btn-primary btn-lg" id="checkinBtn" onclick="doCheckin()" style="font-size:1.2rem;padding:14px 40px;">
                <i data-lucide="sparkles" class="icon"></i> 签到领奖
            </button>
            <div id="checkinResult" style="margin-top:16px;display:none;"></div>
        </div>

        <!-- 签到日历 -->
        <div class="speech-bubble reveal" style="margin-top:24px;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
                <h3 style="font-family:'ZCOOL KuaiLe',cursive;margin:0;"><i data-lucide="calendar" class="icon"></i> 签到日历</h3>
                <div style="display:flex;gap:8px;">
                    <button class="btn btn-sm" onclick="changeMonth(-1)"><i data-lucide="chevron-left" class="icon icon-sm"></i></button>
                    <span id="calendarMonth" style="font-weight:600;line-height:2;"></span>
                    <button class="btn btn-sm" onclick="changeMonth(1)"><i data-lucide="chevron-right" class="icon icon-sm"></i></button>
                </div>
            </div>
            <div id="checkinCalendar" class="checkin-calendar"></div>
            <div style="display:flex;gap:16px;margin-top:12px;font-size:0.75rem;color:var(--text-muted);">
                <span><span class="calendar-dot calendar-checked"></span> 已签到</span>
                <span><span class="calendar-dot calendar-today"></span> 今天</span>
                <span><span class="calendar-dot calendar-unchecked"></span> 未签到</span>
            </div>
        </div>

        <!-- 奖励规则 -->
        <div class="speech-bubble yellow reveal" style="margin-top:24px;">
            <h3 style="font-family:'ZCOOL KuaiLe',cursive;margin-bottom:12px;"><i data-lucide="gift" class="icon"></i> 奖励规则</h3>
            <div style="font-size:0.85rem;line-height:1.8;text-align:left;">
                <p><i data-lucide="pin" class="icon icon-sm"></i> 基础签到：<strong>10 金币 + 2 积分</strong></p>
                <p><i data-lucide="flame" class="icon icon-sm"></i> 连签加成：每天 <strong>+5 金币</strong>，最多 +35</p>
                <p><i data-lucide="gem" class="icon icon-sm"></i> 连签7天可达 <strong>45 金币 + 14 积分</strong>！</p>
                <p><i data-lucide="clock" class="icon icon-sm"></i> 每天 0 点重置，记得来签到哦~</p>
            </div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
let currentYear, currentMonth;
let checkinDates = [];

onUserReady(function() {
    if (!requireAuth()) return;
    const now = new Date();
    currentYear = now.getFullYear();
    currentMonth = now.getMonth() + 1;
    loadCheckinStatus();
});

function loadCheckinStatus() {
    api.get('/api/checkin/status').then(data => {
        document.getElementById('statStreak').textContent = data.streak || 0;
        document.getElementById('statCoins').textContent = data.coins || 0;
        document.getElementById('statPoints').textContent = data.points || 0;
        if (data.checked_in_today) {
            document.getElementById('checkinBtn').disabled = true;
            document.getElementById('checkinBtn').innerHTML = '<i data-lucide="check-circle" class="icon"></i> 今日已签到';
            document.getElementById('checkinBtn').className = 'btn btn-lg';
            if(typeof lucide!=='undefined') lucide.createIcons();
        }
        checkinDates = (data.history || []).map(h => h.checkin_date);
        renderCalendar();
    });
}

function doCheckin() {
    api.post('/api/checkin').then(data => {
        if (data.already) {
            showToast('今天已经签到过了');
            return;
        }
        document.getElementById('checkinIcon').innerHTML = '<i data-lucide="check-circle" class="icon icon-lg"></i>';
        document.getElementById('checkinTitle').textContent = '签到成功！';
        document.getElementById('checkinSub').textContent = `连签 ${data.streak} 天`;
        document.getElementById('checkinBtn').disabled = true;
        document.getElementById('checkinBtn').innerHTML = '<i data-lucide="check-circle" class="icon"></i> 今日已签到';
        document.getElementById('checkinBtn').className = 'btn btn-lg';
        document.getElementById('statStreak').textContent = data.streak;
        document.getElementById('statCoins').textContent = data.total_coins;
        document.getElementById('statPoints').textContent = data.total_points;

        const result = document.getElementById('checkinResult');
        result.style.display = '';
        result.innerHTML = `
            <div class="speech-bubble pink" style="display:inline-block;">
                获得 <strong>${data.coins_earned} 金币</strong> + <strong>${data.points_earned} 积分</strong> <i data-lucide="coins" class="icon icon-sm"></i>
            </div>
        `;
        showToast('签到成功！+' + data.coins_earned + '金币', 'success');
        if(typeof lucide!=='undefined') lucide.createIcons();
        loadCheckinStatus();
    }).catch(e => showToast(e.message || '签到失败', 'error'));
}

function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 12) { currentMonth = 1; currentYear++; }
    if (currentMonth < 1) { currentMonth = 12; currentYear--; }
    renderCalendar();
}

function renderCalendar() {
    const container = document.getElementById('checkinCalendar');
    const monthLabel = document.getElementById('calendarMonth');
    monthLabel.textContent = currentYear + '年' + currentMonth + '月';

    const today = new Date();
    const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    const firstDay = new Date(currentYear, currentMonth - 1, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

    const weekdays = ['日','一','二','三','四','五','六'];
    let html = '<div class="calendar-grid">';
    weekdays.forEach(w => { html += '<div class="calendar-header">' + w + '</div>'; });
    for (let i = 0; i < firstDay; i++) html += '<div class="calendar-cell"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = currentYear + '-' + String(currentMonth).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        const isChecked = checkinDates.includes(dateStr);
        const isToday = dateStr === todayStr;
        let cls = 'calendar-cell';
        if (isChecked) cls += ' calendar-checked';
        else if (isToday) cls += ' calendar-today';
        html += '<div class="' + cls + '"><span class="calendar-day">' + d + '</span>' + (isChecked ? '<i data-lucide="check" class="icon icon-xs"></i>' : '') + '</div>';
    }
    html += '</div>';
    container.innerHTML = html;
    if(typeof lucide!=='undefined') lucide.createIcons();
}
</script>
</body>
</html>

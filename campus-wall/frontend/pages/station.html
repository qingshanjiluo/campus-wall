<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>子站 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:900px;">
        <!-- 子站信息头部 -->
        <div id="stationHeader" class="speech-bubble reveal" style="margin-bottom:32px;">
            <div class="loading">加载中</div>
        </div>

        <!-- 发帖按钮 -->
        <div style="text-align:center;margin-bottom:24px;">
            <button class="btn btn-primary" onclick="openCreatePostForStation()"><i data-lucide="pencil" class="icon icon-sm"></i> 在此子站发帖</button>
        </div>

        <!-- 排序 -->
        <div class="tag-bar reveal" id="stationPostSort">
            <span class="tag active" onclick="sortStationPosts(this,'newest')"><i data-lucide="sparkles" class="icon icon-sm"></i> 最新</span>
            <span class="tag" onclick="sortStationPosts(this,'popular')"><i data-lucide="flame" class="icon icon-sm"></i> 热门</span>
            <span class="tag" onclick="sortStationPosts(this,'comments')"><i data-lucide="message-circle" class="icon icon-sm"></i> 最多评论</span>
        </div>

        <!-- 帖子列表 -->
        <div id="stationPosts"><div class="loading">加载中</div></div>
        <div style="text-align:center;margin-top:24px;">
            <button class="btn" id="loadMoreStationPosts" onclick="loadMoreStationPosts()" style="display:none;"><i data-lucide="chevrons-down" class="icon icon-sm"></i> 加载更多</button>
        </div>

        <!-- 数据统计 -->
        <div style="margin-top:40px;" class="reveal">
            <h3 class="chapter-title" style="font-size:1.3rem;"><i data-lucide="bar-chart-3" class="icon"></i> 数据统计</h3>
            <div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;margin-top:16px;">
                <canvas id="stationStatsChart" height="90"></canvas>
            </div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
const STATION_ID = parseInt(window.location.pathname.split("/")[2], 10) || 0;
let stationData = null;
let stationPostSort = 'newest';
let stationPostOffset = 0;
const stationPostLimit = 15;

onUserReady(function() {
    loadStation();
    loadStationPosts();
    loadStationStats();
    document.addEventListener('postCreated', () => loadStationPosts());
});

function loadStationStats() {
    if (typeof Chart === 'undefined') return;
    api.get('/api/stations/' + STATION_ID + '/stats?days=7').then(s => {
        const ctx = document.getElementById('stationStatsChart');
        if (!ctx) return;
        if (window._stationChart) window._stationChart.destroy();
        window._stationChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: s.labels,
                datasets: [{
                    label: '发帖数',
                    data: s.posts,
                    backgroundColor: 'rgba(255,143,171,0.35)',
                    borderColor: '#fb6f92',
                    borderWidth: 2,
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false } },
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                }
            }
        });
    }).catch(() => {});
}

function loadStation() {
    api.get('/api/stations/' + STATION_ID)
        .then(data => {
            stationData = data;
            renderStationHeader(data);
            document.title = data.name + ' · 校园墙';
        })
        .catch(() => {
            document.getElementById('stationHeader').innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="frown" class="icon icon-lg"></i></div><div class="text">子站不存在</div></div>';
        });
}

function renderStationHeader(s) {
    const tags = (s.tags||[]).map(t => '<span class="tag" style="display:inline-block;">#'+escHtml(t)+'</span>').join('');
    const joinBtn = s.is_member
        ? '<button class="btn btn-sm" onclick="leaveStation()"><i data-lucide="log-out" class="icon icon-sm"></i> 退出</button>'
        : '<button class="btn btn-primary btn-sm" onclick="joinStation()"><i data-lucide="plus" class="icon icon-sm"></i> 加入</button>';
    // 站长管理按钮（owner 或全局 admin）
    const canManage = (currentUser && (s.is_owner || (currentUser.role === 'admin'))) ||
                      (currentUser && currentUser.role === 'admin');
    const manageBtns = canManage ? `
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
            <button class="btn btn-sm" onclick="openStationSettings()"><i data-lucide="settings" class="icon icon-sm"></i> 管理子站</button>
            <button class="btn btn-sm" onclick="showStationMembers()"><i data-lucide="users" class="icon icon-sm"></i> 成员</button>
        </div>
    ` : '';
    document.getElementById('stationHeader').innerHTML = `
        ${s.cover ? `<div class="station-banner" style="background-image:url('${escHtml(s.cover)}');"></div>` : ''}
        ${s.announcement ? `<div class="station-announcement"><i data-lucide="megaphone" class="icon icon-sm"></i> <span>${escHtml(s.announcement)}</span></div>` : ''}
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
            <div class="station-icon" style="width:56px;height:56px;font-size:1.8rem;border-radius:16px;"><i data-lucide="${getStationIcon(s.icon)}" class="icon"></i></div>
            <div style="flex:1;min-width:200px;">
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <h2 style="font-family:'ZCOOL KuaiLe',cursive;font-size:1.5rem;margin-bottom:4px;">${escHtml(s.name)}</h2>
                    ${s.is_public === 0 ? '<span class="profile-badge" style="background:var(--lavender);"><i data-lucide="lock" class="icon icon-sm"></i> 私密</span>' : ''}
                </div>
                <p style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:8px;">${escHtml(s.description||'')}</p>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;">${tags}</div>
                <div style="font-size:0.8rem;color:var(--text-muted);">
                    <i data-lucide="users" class="icon icon-sm"></i> ${s.user_count||0} 成员 · <i data-lucide="file-text" class="icon icon-sm"></i> ${s.post_count||0} 帖子
                </div>
                ${manageBtns}
            </div>
            <div>${joinBtn}</div>
        </div>
    `;
    if (window.lucide) lucide.createIcons();
}

function openStationSettings() {
    if (!requireAuth()) return;
    const s = stationData;
    const modal = document.createElement('div');
    modal.className = 'modal-overlay show';
    modal.innerHTML = `
        <div class="modal" style="max-width:520px;position:relative;">
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            <h3 style="font-family:'ZCOOL KuaiLe',cursive;margin-bottom:16px;"><i data-lucide="settings" class="icon icon-sm"></i> 管理子站</h3>
            <form onsubmit="updateStationSettings(event,this)">
                <input class="input" name="name" placeholder="子站名称" value="${escHtml(s.name||'')}" style="margin-bottom:10px;">
                <textarea class="input" name="description" placeholder="子站简介" rows="3" style="margin-bottom:10px;">${escHtml(s.description||'')}</textarea>
                <input class="input" name="icon" placeholder="图标（如 school）" value="${escHtml(s.icon||'school')}" style="margin-bottom:10px;">
                <input class="input" name="category" placeholder="分类（如 情感/表白，支持层级）" value="${escHtml(s.category||'')}" style="margin-bottom:10px;">
                <input class="input" name="cover" placeholder="封面图 URL（可选）" value="${escHtml(s.cover||'')}" style="margin-bottom:6px;">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <button type="button" class="btn btn-sm" onclick="uploadStationCover(this)"><i data-lucide="upload" class="icon icon-sm"></i> 上传封面</button>
                    <input type="file" accept="image/*" style="display:none;" onchange="handleCoverFile(this)">
                </div>
                <input class="input" name="announcement" placeholder="子站公告（可选，显示在顶部）" value="${escHtml(s.announcement||'')}" style="margin-bottom:10px;">
                <input class="input" name="tags" placeholder="标签，用逗号分隔（最多5个）" value="${escHtml((s.tags||[]).join(','))}" style="margin-bottom:16px;">
                <div style="display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;">
                    <label class="input" style="width:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
                        <input type="checkbox" name="is_public" ${s.is_public !== 0 ? 'checked' : ''}> 公开子站
                    </label>
                    <label class="input" style="width:auto;display:inline-flex;align-items:center;gap:6px;cursor:pointer;">
                        <input type="checkbox" name="only_owner_posts" ${s.only_owner_posts ? 'checked' : ''}> 仅站长可发帖
                    </label>
                </div>
                <div style="display:flex;gap:8px;">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn btn-outline" onclick="transferStation(this)">转让子站</button>
                    <button type="button" class="btn btn-outline" style="color:var(--danger);" onclick="deleteStationConfirm(this)">删除子站</button>
                </div>
            </form>
        </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
    if (window.lucide) lucide.createIcons();
}

function updateStationSettings(e, form) {
    e.preventDefault();
    const data = {
        name: form.name.value.trim(),
        description: form.description.value.trim(),
        icon: form.icon.value.trim() || 'school',
        category: form.category.value.trim(),
        cover: form.cover.value.trim(),
        announcement: form.announcement.value.trim(),
        tags: form.tags.value.split(',').map(t => t.trim()).filter(Boolean).slice(0, 5),
        is_public: form.is_public.checked ? 1 : 0,
        only_owner_posts: form.only_owner_posts.checked ? 1 : 0
    };
    api.put('/api/stations/' + STATION_ID, data)
        .then(() => { showToast('更新成功', 'success'); loadStation(); const m = form.closest('.modal-overlay'); if (m) m.remove(); })
        .catch(err => showToast(err.message || '更新失败', 'error'));
    return false;
}

function transferStation(btn) {
    const uid = prompt('输入新子站长（用户ID）:');
    if (!uid) return;
    if (!confirm('确定将子站转让给用户 #' + uid + '？')) return;
    const modal = btn.closest('.modal-overlay');
    api.post('/api/stations/' + STATION_ID + '/transfer', { new_owner_id: parseInt(uid) })
        .then(data => { showToast(data.message, 'success'); if (modal) modal.remove(); loadStation(); })
        .catch(e => showToast(e.message || '转让失败', 'error'));
}

function uploadStationCover(btn) {
    const input = btn.parentElement.querySelector('input[type=file]');
    if (input) input.click();
}

function handleCoverFile(input) {
    if (!input.files || !input.files[0]) return;
    const fd = new FormData();
    fd.append('file', input.files[0]);
    fetch('/api/stations/upload-cover', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + (api.getToken() || '') },
        body: fd
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) { showToast(data.error, 'error'); return; }
        const coverInput = input.closest('.modal').querySelector('input[name=cover]');
        if (coverInput) coverInput.value = data.url;
        showToast('封面已上传', 'success');
    })
    .catch(() => showToast('上传失败', 'error'));
}

function deleteStationConfirm(btn) {
    if (!confirm('确定要永久删除这个子站吗？此操作不可恢复！')) return;
    if (!confirm('再次确认：子站及所有成员关系将被删除。')) return;
    api.delete('/api/stations/' + STATION_ID)
        .then(() => { showToast('子站已删除', 'success'); setTimeout(() => window.location.href = '/', 1000); })
        .catch(e => showToast(e.message || '删除失败', 'error'));
}

function showStationMembers() {
    if (!requireAuth()) return;
    api.get('/api/stations/' + STATION_ID + '/members').then(data => {
        const canManage = stationData && (stationData.is_owner || (currentUser && currentUser.role === 'admin'));
        const modal = document.createElement('div');
        modal.className = 'modal-overlay show';
        modal.innerHTML = `
            <div class="modal" style="max-width:520px;position:relative;max-height:80vh;overflow-y:auto;">
                <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                <h3 style="font-family:'ZCOOL KuaiLe',cursive;margin-bottom:16px;"><i data-lucide="users" class="icon icon-sm"></i> 成员 (${(data.members||[]).length})</h3>
                <div>
                    ${(data.members||[]).map(m => `
                        <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.05);">
                            <img src="${safeUrl(m.avatar, '/static/images/default-avatar.svg')}" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--glass-border);" onerror="this.src='/static/images/default-avatar.svg'">
                            <a href="/profile/${m.user_id}" style="flex:1;font-weight:600;font-size:0.9rem;color:var(--text-dark);text-decoration:none;">${escHtml(m.username)}</a>
                            <span style="font-size:0.7rem;${m.role==='owner'?'background:var(--yellow);':'background:var(--lavender);'}padding:2px 8px;border-radius:8px;">${m.role==='owner'?'<i data-lucide=\"crown\" class=\"icon icon-sm\"></i> 子站长':'成员'}</span>
                            ${canManage && m.role !== 'owner' ? '<button class="btn btn-sm" style="padding:4px 10px;font-size:0.7rem;" onclick="removeMemberConfirm('+m.user_id+',this)">移除</button>' : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);
        if (window.lucide) lucide.createIcons();
    }).catch(() => showToast('加载成员失败', 'error'));
}

function removeMemberConfirm(uid, btn) {
    if (!confirm('确定移除该成员？')) return;
    api.delete('/api/stations/' + STATION_ID + '/members/' + uid)
        .then(data => { showToast(data.message, 'success'); showStationMembers(); })
        .catch(e => showToast(e.message || '操作失败', 'error'));
}

function joinStation() {
    if (!requireAuth()) return;
    api.post('/api/stations/' + STATION_ID + '/join')
        .then(data => { showToast(data.message); loadStation(); })
        .catch(e => showToast(e.message || '操作失败'));
}

function leaveStation() {
    api.post('/api/stations/' + STATION_ID + '/leave')
        .then(data => { showToast(data.message); loadStation(); })
        .catch(e => showToast(e.message || '操作失败'));
}

function loadStationPosts(append) {
    if (!append) stationPostOffset = 0;
    const list = document.getElementById('stationPosts');
    if (!append) list.innerHTML = '<div class="loading">加载中</div>';
    api.get(`/api/stations/${STATION_ID}/posts?limit=${stationPostLimit}&offset=${stationPostOffset}&sort=${stationPostSort}`)
        .then(data => {
            renderStationPosts(data.posts, append);
            const btn = document.getElementById('loadMoreStationPosts');
            if (data.posts.length >= stationPostLimit) {
                btn.style.display = '';
                stationPostOffset += stationPostLimit;
            } else {
                btn.style.display = 'none';
            }
        })
        .catch(() => { if (!append) list.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="frown" class="icon icon-lg"></i></div><div class="text">加载失败</div></div>'; });
}

function renderStationPosts(posts, append) {
    const list = document.getElementById('stationPosts');
    if (!posts || posts.length === 0) {
        if (!append) list.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="file-text" class="icon icon-lg"></i></div><div class="text">还没有帖子，来发第一帖吧！</div></div>';
        return;
    }
    const html = posts.map(p => renderPostCard(p)).join('');
    if (append) list.insertAdjacentHTML('beforeend', html);
    else list.innerHTML = html;
    initReveal();
}

function sortStationPosts(el, sort) {
    document.querySelectorAll('#stationPostSort .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    stationPostSort = sort;
    loadStationPosts();
}

function loadMoreStationPosts() {
    loadStationPosts(true);
}

function openCreatePostForStation() {
    if (!requireAuth()) return;
    openModal('createPostModal');
    setTimeout(() => {
        const sel = document.getElementById('postStationSelect');
        if (sel) sel.value = STATION_ID;
    }, 100);
}
</script>
</body>
</html>

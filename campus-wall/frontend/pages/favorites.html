<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:900px;">
        <div class="section-header reveal">
            <h2 class="chapter-title">🔖 我的收藏</h2>
            <p class="chapter-sub">收藏的帖子和子站</p>
        </div>

        <div class="tag-bar reveal" id="favTabs">
            <span class="tag active" onclick="switchFavTab(this,'post')">📝 帖子</span>
            <span class="tag" onclick="switchFavTab(this,'station')">🏫 子站</span>
        </div>
        <div id="favList"><div class="loading">加载中</div></div>
    </div>
</div>
    </main>
</div>
<script>
let currentFavType = 'post';

onUserReady(function() {
    if (!requireAuth()) return;
    loadFavorites();
});

function switchFavTab(el, type) {
    document.querySelectorAll('#favTabs .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    currentFavType = type;
    loadFavorites();
}

function loadFavorites() {
    const list = document.getElementById('favList');
    list.innerHTML = '<div class="loading">加载中</div>';
    api.get('/api/favorites?type=' + currentFavType).then(data => {
        const items = data.items || [];
        if (!items.length) {
            list.innerHTML = '<div class="empty-state"><div class="icon">🔖</div><div class="text">还没有收藏，去发现有趣的内容吧</div></div>';
            return;
        }
        if (currentFavType === 'post') {
            list.innerHTML = items.map(f => renderPostCard(f)).join('');
        } else {
            list.innerHTML = items.map(s => `
                <div class="station-card reveal" style="cursor:pointer;" onclick="window.location.href='/station/${s.id}'">
                    <div class="station-card-header">
                        <div class="station-icon">${s.icon||'🏫'}</div>
                        <div class="name">${escHtml(s.name)}</div>
                    </div>
                    <div class="desc">${escHtml(s.description||'')}</div>
                    <div class="meta"><span>👥 ${s.user_count||0}</span><span>📝 ${s.post_count||0}</span></div>
                </div>
            `).join('');
        }
        initReveal();
    }).catch(() => list.innerHTML = '<div class="empty-state"><div class="icon">😢</div><div class="text">加载失败</div></div>');
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:800px;">
        <div id="postDetail"><div class="loading">加载中</div></div>

        <!-- 评论区 -->
        <div style="margin-top:40px;" id="commentSection">
            <h3 class="chapter-title" style="font-size:1.5rem;margin-bottom:16px;"><i data-lucide="message-circle" class="icon"></i> 评论</h3>
            <div id="commentForm" style="display:none;margin-bottom:24px;">
                <form onsubmit="return submitComment(event)">
                    <textarea class="input" id="commentContent" placeholder="说说你的想法..." rows="3" required maxlength="2000"></textarea>
                    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
                        <button type="submit" class="btn btn-primary btn-sm">发表评论</button>
                        <span style="font-size:0.75rem;color:var(--text-muted);" id="replyHint"></span>
                    </div>
                </form>
            </div>
            <div id="commentList"><div class="loading">加载中</div></div>
        </div>

        <!-- 相关推荐 -->
        <div style="margin-top:40px;" id="relatedSection">
            <h3 class="chapter-title" style="font-size:1.5rem;margin-bottom:16px;"><i data-lucide="sparkles" class="icon"></i> 相关推荐</h3>
            <div id="relatedList"><div class="loading">加载中</div></div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
const POST_ID = parseInt(window.location.pathname.split("/")[2], 10) || 0;
let postData = null;

onUserReady(function() {
    loadPost();
    loadComments();
});

function loadPost() {
    api.get('/api/posts/' + POST_ID).then(data => {
        postData = data;
        if (currentUser) {
            api.get('/api/favorites/status/post/' + POST_ID).then(res => { data.is_favorited = res.favorited; renderPostDetail(data); }).catch(() => renderPostDetail(data));
        } else {
            data.is_favorited = false;
            renderPostDetail(data);
        }
        document.title = data.title + ' · 校园墙';
        loadRelated(data.station_id, data.id);
    }).catch(() => {
        document.getElementById('postDetail').innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="frown" class="icon icon-lg"></i></div><div class="text">帖子不存在或已被删除</div></div>';
    });
}

function loadRelated(stationId, currentPostId) {
    const list = document.getElementById('relatedList');
    let url = '/api/posts?limit=5&sort=popular';
    if (stationId) url += '&station_id=' + stationId;
    api.get(url).then(data => {
        const posts = (data.posts || []).filter(p => p.id !== currentPostId).slice(0, 5);
        if (posts.length === 0) {
            list.innerHTML = '<div class="empty-state"><i data-lucide="sparkles" class="icon empty-icon"></i><div class="text">暂无更多推荐</div></div>';
            if(typeof lucide!=='undefined') lucide.createIcons();
            return;
        }
        list.innerHTML = posts.map(p => `
            <div class="post-card reveal" onclick="window.location.href='/post/${p.id}'" style="padding:16px;margin-bottom:12px;">
                <div class="post-header">
                    <img class="post-avatar" src="${safeUrl(p.author_avatar, '/static/images/default-avatar.svg')}" alt="" onerror="this.src='/static/images/default-avatar.svg'">
                    <div class="post-meta">
                        <div class="post-author">${escHtml(p.author_name)}</div>
                        <div class="post-time">${formatTime(p.created_at)}</div>
                    </div>
                    <span class="post-station"><i data-lucide="${getStationIcon(p.station_icon)}" class="icon icon-sm"></i> ${escHtml(p.station_name||'')}</span>
                </div>
                <div class="post-title">${escHtml(p.title)}</div>
                <div class="post-actions">
                    <span class="post-action"><i data-lucide="heart" class="icon icon-sm"></i> ${p.likes_count||0}</span>
                    <span class="post-action"><i data-lucide="message-circle" class="icon icon-sm"></i> ${p.comments_count||0}</span>
                </div>
            </div>
        `).join('');
        if(typeof lucide!=='undefined') lucide.createIcons();
        initReveal();
    }).catch(() => {
        list.innerHTML = '<div class="empty-state"><i data-lucide="cloud-off" class="icon empty-icon"></i><div class="text">推荐加载失败</div></div>';
        if(typeof lucide!=='undefined') lucide.createIcons();
    });
}

function renderPostDetail(p) {
    const time = formatTime(p.created_at);
    const isAuthor = currentUser && currentUser.id === p.author_id;
    const isAdmin = currentUser && currentUser.role === 'admin';
    let actionBtns = '';
    if (isAuthor || isAdmin) {
        actionBtns = `
            <button class="btn btn-sm btn-ghost" onclick="openEditPost(${p.id})" title="编辑"><i data-lucide="pencil" class="icon icon-sm"></i></button>
            <button class="btn btn-sm btn-ghost" onclick="showEditHistory(${p.id})" title="编辑历史"><i data-lucide="history" class="icon icon-sm"></i></button>
            <button class="btn btn-sm btn-ghost" onclick="deletePost(${p.id})" title="删除" style="color:var(--text-muted);"><i data-lucide="trash-2" class="icon icon-sm"></i></button>
        `;
    }
    if (p.is_pinned) {
        actionBtns = `<span class="post-station" style="background:var(--color-accent);color:white;"><i data-lucide="pin" class="icon icon-sm"></i> 置顶</span>` + actionBtns;
    }
    document.getElementById('postDetail').innerHTML = `
        <article class="speech-bubble reveal" style="position:relative;">
            <div class="post-header" style="margin-bottom:16px;">
                <img class="post-avatar" src="${safeUrl(p.author_avatar, '/static/images/default-avatar.svg')}" alt="" onclick="window.location.href='/profile/${p.author_id}'" style="cursor:pointer;" onerror="this.src='/static/images/default-avatar.svg'">
                <div class="post-meta">
                    <div class="post-author" style="cursor:pointer;" onclick="window.location.href='/profile/${p.author_id}'">${escHtml(p.author_name)}</div>
                    <div class="post-time">${time}</div>
                </div>
                <span class="post-station" onclick="window.location.href='/station/${p.station_id}'" style="cursor:pointer;"><i data-lucide="${getStationIcon(p.station_icon)}" class="icon icon-sm"></i> ${escHtml(p.station_name||'')}</span>
                ${actionBtns}
            </div>
            <h1 style="font-family:'ZCOOL KuaiLe',cursive;font-size:1.5rem;margin-bottom:12px;line-height:1.4;">${escHtml(p.title)}</h1>
            <div class="post-content full" style="margin-bottom:16px;word-break:break-word;">${renderContent(p.content, true)}</div>
            ${p.post_type === 'vote' && p.vote_options ? renderVoteSection(p) : ''}
            <div class="post-actions">
                <button class="post-action ${p.is_liked?'liked':''}" onclick="toggleLike(${p.id},this)" data-likes="${p.likes_count||0}">
                    <i data-lucide="${p.is_liked?'heart':'heart'}" class="icon icon-sm"></i> ${p.likes_count||0}
                </button>
                <span class="post-action"><i data-lucide="message-circle" class="icon icon-sm"></i> ${p.comments_count||0}</span>
                <span class="post-action"><i data-lucide="eye" class="icon icon-sm"></i> ${p.views||0}</span>
                <button class="post-action btn-ghost" onclick="sharePost(${p.id})" style="padding:0;" title="分享">
                    <i data-lucide="share-2" class="icon icon-sm"></i>
                </button>
                <button class="post-action btn-ghost ${p.is_favorited?'liked':''}" id="favBtn" onclick="toggleFav(${p.id},this)" style="padding:0;margin-left:auto;">
                    <i data-lucide="bookmark" class="icon icon-sm"></i> ${p.is_favorited?'已收藏':'收藏'}
                </button>
                <button class="post-action btn-ghost" onclick="reportTarget('post',${p.id})" style="padding:0;" title="举报"><i data-lucide="flag" class="icon icon-sm"></i></button>
            </div>
        </article>
    `;
    document.getElementById('commentForm').style.display = currentUser ? '' : 'none';
    initReveal();
    if (window.lucide) lucide.createIcons();
}

function loadComments() {
    api.get('/api/posts/' + POST_ID + '/comments').then(data => renderComments(data)).catch(() => {
        document.getElementById('commentList').innerHTML = '<div class="loading">加载失败</div>';
    });
}

function renderComments(comments) {
    const list = document.getElementById('commentList');
    if (!comments || comments.length === 0) {
        list.innerHTML = '<div class="empty-state" style="padding:30px;"><div class="icon"><i data-lucide="message-circle" class="icon icon-lg"></i></div><div class="text">还没有评论，来说两句吧</div></div>';
        return;
    }
    // 楼中楼：parent_id 的评论缩进显示在父评论下方
    const topLevel = comments.filter(c => !c.parent_id);
    const replies = comments.filter(c => c.parent_id);
    const replyHtml = {};
    replies.forEach(r => {
        const parent = comments.find(x => x.id === r.parent_id);
        (replyHtml[r.parent_id] = replyHtml[r.parent_id] || []).push({ r, parent });
    });

    const renderComment = (c) => `
        <div class="comment-item">
            <img class="comment-avatar" src="${safeUrl(c.author_avatar, '/static/images/default-avatar.svg')}" alt="" onerror="this.src='/static/images/default-avatar.svg'" onclick="window.location.href='/profile/${c.author_id}'" style="cursor:pointer;">
            <div class="comment-body">
                <div class="comment-author">
                    <span onclick="window.location.href='/profile/${c.author_id}'" style="cursor:pointer;">${escHtml(c.author_name)}</span>
                    <span class="comment-time">${formatTime(c.created_at)}</span>
                </div>
                <div class="comment-content">${escHtml(c.content)}</div>
                <div class="comment-actions">
                    <button class="post-action btn-ghost ${c.is_liked?'liked':''}" onclick="toggleCommentLike(${c.id},this)" data-likes="${c.likes_count||0}" style="padding:0;">
                        <i data-lucide="heart" class="icon icon-sm"></i> ${c.likes_count||0}
                    </button>
                    ${currentUser ? `<button class="post-action btn-ghost" onclick="replyToCommentById(this)" data-cid="${c.id}" data-author="${escHtml(c.author_name)}" style="padding:0;font-size:0.75rem;"><i data-lucide="reply" class="icon icon-sm"></i> 回复</button>` : ''}
                    ${currentUser && (currentUser.id === c.author_id || currentUser.role === 'admin') ? `<button class="post-action btn-ghost" onclick="deleteComment(${c.id})" style="padding:0;font-size:0.75rem;color:var(--text-muted);"><i data-lucide="trash-2" class="icon icon-sm"></i></button>` : ''}
                </div>
            </div>
        </div>
    `;

    // 顶层评论 + 其下的回复
    let html = '';
    const shown = new Set();
    const renderThread = (c) => {
        if (shown.has(c.id)) return '';
        shown.add(c.id);
        let h = renderComment(c);
        const childs = replyHtml[c.id] || [];
        if (childs.length) {
            h += `<div style="margin-left:44px;padding-left:14px;border-left:2px solid var(--pink-2);">` +
                 childs.map(({ r, parent }) => {
                     let h2 = renderComment(r);
                     // 在被回复的父评论上方标注回复对象
                     h2 = h2.replace('<div class="comment-content">', `<div class="comment-content" style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:2px;">回复 @${escHtml(parent ? parent.author_name : '')}</div><div class="comment-content">`);
                     return h2;
                 }).join('') + `</div>`;
        }
        return h;
    };

    // 顶层的先排，再追加只有回复没有顶层父（安全兜底）
    topLevel.forEach(c => { html += renderThread(c); });
    replies.forEach(c => { if (!shown.has(c.id)) html += renderThread(c); });
    list.innerHTML = html;
    if (window.lucide) lucide.createIcons();
}

function deletePost(pid) {
    if (!confirm('确定要删除这篇帖子吗？')) return;
    api.delete('/api/posts/' + pid).then(() => {
        showToast('已删除', 'success');
        window.location.href = '/';
    }).catch(e => showToast(e.message || '删除失败', 'error'));
}

function deleteComment(cid) {
    if (!confirm('确定要删除这条评论吗？')) return;
    api.delete('/api/posts/comments/' + cid).then(() => {
        showToast('已删除', 'success');
        loadComments();
    }).catch(e => showToast(e.message || '删除失败', 'error'));
}

function toggleFav(pid, btn) {
    if (!requireAuth()) return;
    api.post('/api/favorites/post/' + pid).then(res => {
        btn.classList.toggle('liked', res.favorited);
        btn.innerHTML = res.favorited ? '<i data-lucide="bookmark" class="icon icon-sm"></i> 已收藏' : '<i data-lucide="bookmark" class="icon icon-sm"></i> 收藏';
        showToast(res.message, 'success');
    }).catch(e => showToast(e.message || '操作失败', 'error'));
}

function reportTarget(targetType, targetId) {
    openReportModal(targetType, targetId);
}

function showEditHistory(pid) {
    api.get('/api/posts/' + pid + '/versions').then(res => {
        const versions = res.versions || [];
        const modal = document.createElement('div');
        modal.className = 'modal-overlay show';
        modal.innerHTML = `
            <div class="modal" style="max-width:640px;position:relative;max-height:80vh;overflow-y:auto;">
                <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
                <div class="modal-title"><i data-lucide="history" class="icon icon-md"></i> 编辑历史</div>
                ${versions.length === 0 ? '<div class="empty-state" style="padding:20px;"><i data-lucide="history" class="icon empty-icon"></i><div class="text">暂无编辑历史</div></div>' : versions.map((v, idx) => `
                    <div class="post-card" style="padding:16px;margin-bottom:12px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <span class="tag">版本 ${versions.length - idx}</span>
                            <span style="font-size:0.75rem;color:var(--text-muted);">${formatTime(v.created_at)} · ${escHtml(v.editor_name||'未知')}</span>
                        </div>
                        <div style="font-weight:700;font-size:0.95rem;margin-bottom:6px;">${escHtml(v.title)}</div>
                        <div style="font-size:0.85rem;color:var(--text-secondary);white-space:pre-wrap;max-height:120px;overflow-y:auto;">${renderContent(v.content, false)}</div>
                    </div>
                `).join('')}
            </div>
        `;
        modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
        document.body.appendChild(modal);
        if (window.lucide) lucide.createIcons();
    }).catch(e => showToast(e.message || '加载失败', 'error'));
}
</script>
</body>
</html>

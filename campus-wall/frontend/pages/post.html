<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帖子详情 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:800px;">
        <div id="postDetail"><div class="loading">加载中</div></div>

        <!-- 评论区 -->
        <div style="margin-top:40px;" id="commentSection">
            <h3 class="chapter-title" style="font-size:1.5rem;margin-bottom:16px;">💬 评论</h3>
            <div id="commentForm" style="display:none;margin-bottom:24px;">
                <form onsubmit="return submitComment(event)">
                    <textarea class="input" id="commentContent" placeholder="说说你的想法..." rows="3" required maxlength="2000"></textarea>
                    <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">
                        <button type="submit" class="btn btn-primary btn-sm">发表评论</button>
                        <span style="font-size:0.75rem;color:var(--text-muted);" id="replyHint"></span>
                    </div>
                </form>
            </div>
            <div id="commentList"><div class="loading">加载中</div></div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
const POST_ID = parseInt(window.location.pathname.split("/")[2], 10) || 0;
let postData = null;

onUserReady(function() {
    loadPost();
    loadComments();
});

function loadPost() {
    api.get('/api/posts/' + POST_ID).then(data => {
        postData = data;
        if (currentUser) {
            api.get('/api/favorites/status/post/' + POST_ID).then(res => { data.is_favorited = res.favorited; renderPostDetail(data); }).catch(() => renderPostDetail(data));
        } else {
            data.is_favorited = false;
            renderPostDetail(data);
        }
        document.title = data.title + ' · 校园墙';
    }).catch(() => {
        document.getElementById('postDetail').innerHTML = '<div class="empty-state"><div class="icon">😢</div><div class="text">帖子不存在或已被删除</div></div>';
    });
}

function renderPostDetail(p) {
    const time = formatTime(p.created_at);
    const isAuthor = currentUser && currentUser.id === p.author_id;
    const isAdmin = currentUser && currentUser.role === 'admin';
    let actionBtns = '';
    if (isAuthor || isAdmin) {
        actionBtns = `
            <button class="btn btn-sm btn-ghost" onclick="openEditPost(${p.id})" title="编辑">✏️</button>
            <button class="btn btn-sm btn-ghost" onclick="deletePost(${p.id})" title="删除" style="color:var(--text-muted);">🗑️</button>
        `;
    }
    if (p.is_pinned) {
        actionBtns = `<span class="post-station" style="background:var(--yellow);color:var(--text-dark);">📌 置顶</span>` + actionBtns;
    }
    document.getElementById('postDetail').innerHTML = `
        <article class="speech-bubble reveal" style="position:relative;">
            <div class="post-header" style="margin-bottom:16px;">
                <img class="post-avatar" src="${p.author_avatar||'/static/images/default-avatar.svg'}" alt="" onclick="window.location.href='/profile/${p.author_id}'" style="cursor:pointer;" onerror="this.src='/static/images/default-avatar.svg'">
                <div class="post-meta">
                    <div class="post-author" style="cursor:pointer;" onclick="window.location.href='/profile/${p.author_id}'">${escHtml(p.author_name)}</div>
                    <div class="post-time">${time}</div>
                </div>
                <span class="post-station" onclick="window.location.href='/station/${p.station_id}'" style="cursor:pointer;">${p.station_icon||'🏫'} ${escHtml(p.station_name||'')}</span>
                ${actionBtns}
            </div>
            <h1 style="font-family:'ZCOOL KuaiLe',cursive;font-size:1.5rem;margin-bottom:12px;line-height:1.4;">${escHtml(p.title)}</h1>
            <div class="post-content full" style="margin-bottom:16px;word-break:break-word;">${renderContent(p.content, true)}</div>
            <div class="post-actions">
                <button class="post-action ${p.is_liked?'liked':''}" onclick="toggleLike(${p.id},this)" data-likes="${p.likes_count||0}">
                    <span class="icon">${p.is_liked?'❤️':'🤍'}</span> ${p.likes_count||0}
                </button>
                <span class="post-action"><span class="icon">💬</span> ${p.comments_count||0}</span>
                <span class="post-action"><span class="icon">👁️</span> ${p.views||0}</span>
                <button class="post-action btn-ghost ${p.is_favorited?'liked':''}" id="favBtn" onclick="toggleFav(${p.id},this)" style="padding:0;margin-left:auto;">
                    <span class="icon">${p.is_favorited?'🔖':'🤍'}</span> ${p.is_favorited?'已收藏':'收藏'}
                </button>
                <button class="post-action btn-ghost" onclick="reportTarget('post',${p.id})" style="padding:0;" title="举报">🚩</button>
            </div>
        </article>
    `;
    document.getElementById('commentForm').style.display = currentUser ? '' : 'none';
    initReveal();
}

function loadComments() {
    api.get('/api/posts/' + POST_ID + '/comments').then(data => renderComments(data)).catch(() => {
        document.getElementById('commentList').innerHTML = '<div class="loading">加载失败</div>';
    });
}

function renderComments(comments) {
    const list = document.getElementById('commentList');
    if (!comments || comments.length === 0) {
        list.innerHTML = '<div class="empty-state" style="padding:30px;"><div class="icon">💬</div><div class="text">还没有评论，来说两句吧</div></div>';
        return;
    }
    // 楼中楼：parent_id 的评论缩进显示在父评论下方
    const topLevel = comments.filter(c => !c.parent_id);
    const replies = comments.filter(c => c.parent_id);
    const replyHtml = {};
    replies.forEach(r => {
        const parent = comments.find(x => x.id === r.parent_id);
        (replyHtml[r.parent_id] = replyHtml[r.parent_id] || []).push({ r, parent });
    });

    const renderComment = (c) => `
        <div class="comment-item">
            <img class="comment-avatar" src="${c.author_avatar||'/static/images/default-avatar.svg'}" alt="" onerror="this.src='/static/images/default-avatar.svg'" onclick="window.location.href='/profile/${c.author_id}'" style="cursor:pointer;">
            <div class="comment-body">
                <div class="comment-author">
                    <span onclick="window.location.href='/profile/${c.author_id}'" style="cursor:pointer;">${escHtml(c.author_name)}</span>
                    <span class="comment-time">${formatTime(c.created_at)}</span>
                </div>
                <div class="comment-content">${escHtml(c.content)}</div>
                <div class="comment-actions">
                    <button class="post-action btn-ghost ${c.is_liked?'liked':''}" onclick="toggleCommentLike(${c.id},this)" data-likes="${c.likes_count||0}" style="padding:0;">
                        <span class="icon">${c.is_liked?'❤️':'🤍'}</span> ${c.likes_count||0}
                    </button>
                    ${currentUser ? `<button class="post-action btn-ghost" onclick="replyToCommentById(this)" data-cid="${c.id}" data-author="${escHtml(c.author_name)}" style="padding:0;font-size:0.75rem;">↩️ 回复</button>` : ''}
                    ${currentUser && (currentUser.id === c.author_id || currentUser.role === 'admin') ? `<button class="post-action btn-ghost" onclick="deleteComment(${c.id})" style="padding:0;font-size:0.75rem;color:var(--text-muted);">🗑️</button>` : ''}
                </div>
            </div>
        </div>
    `;

    // 顶层评论 + 其下的回复
    let html = '';
    const shown = new Set();
    const renderThread = (c) => {
        if (shown.has(c.id)) return '';
        shown.add(c.id);
        let h = renderComment(c);
        const childs = replyHtml[c.id] || [];
        if (childs.length) {
            h += `<div style="margin-left:44px;padding-left:14px;border-left:2px solid var(--pink-2);">` +
                 childs.map(({ r, parent }) => {
                     let h2 = renderComment(r);
                     // 在被回复的父评论上方标注回复对象
                     h2 = h2.replace('<div class="comment-content">', `<div class="comment-content" style="font-size:0.85rem;color:var(--text-secondary);margin-bottom:2px;">回复 @${escHtml(parent ? parent.author_name : '')}</div><div class="comment-content">`);
                     return h2;
                 }).join('') + `</div>`;
        }
        return h;
    };

    // 顶层的先排，再追加只有回复没有顶层父（安全兜底）
    topLevel.forEach(c => { html += renderThread(c); });
    replies.forEach(c => { if (!shown.has(c.id)) html += renderThread(c); });
    list.innerHTML = html;
}

function deletePost(pid) {
    if (!confirm('确定要删除这篇帖子吗？')) return;
    api.delete('/api/posts/' + pid).then(() => {
        showToast('已删除', 'success');
        window.location.href = '/';
    }).catch(e => showToast(e.message || '删除失败', 'error'));
}

function deleteComment(cid) {
    if (!confirm('确定要删除这条评论吗？')) return;
    api.delete('/api/posts/comments/' + cid).then(() => {
        showToast('已删除', 'success');
        loadComments();
    }).catch(e => showToast(e.message || '删除失败', 'error'));
}

function toggleFav(pid, btn) {
    if (!requireAuth()) return;
    api.post('/api/favorites/post/' + pid).then(res => {
        btn.classList.toggle('liked', res.favorited);
        btn.innerHTML = res.favorited ? '<span class="icon">🔖</span> 已收藏' : '<span class="icon">🤍</span> 收藏';
        showToast(res.message, 'success');
    }).catch(e => showToast(e.message || '操作失败', 'error'));
}

function reportTarget(targetType, targetId) {
    if (!requireAuth()) return;
    const reasons = ['广告', '色情低俗', '暴力', '诈骗', '辱骂', '侵权', '其他'];
    const reason = prompt('请选择举报原因（1-7）:\n1.广告\n2.色情低俗\n3.暴力\n4.诈骗\n5.辱骂\n6.侵权\n7.其他');
    if (!reason) return;
    const idx = parseInt(reason) - 1;
    const reasonText = reasons[idx] || '其他';
    const detail = prompt('补充说明（可选）:') || '';
    api.post('/api/reports', { target_type: targetType, target_id: targetId, reason: reasonText, detail })
        .then(res => showToast(res.message, 'success'))
        .catch(e => showToast(e.message || '举报失败', 'error'));
}
</script>
</body>
</html>

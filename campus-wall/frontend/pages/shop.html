<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商城 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:1100px;">
        <div class="section-header reveal">
            <h2 class="chapter-title"><i data-lucide="shopping-bag" class="icon"></i> 积分商城</h2>
            <p class="chapter-sub">用金币和积分兑换专属好物</p>
        </div>

        <!-- 余额 -->
        <div class="speech-bubble reveal" style="text-align:center;margin-bottom:24px;">
            <span style="font-size:1.1rem;"><i data-lucide="coins" class="icon icon-sm"></i> 金币: <strong id="myCoins">-</strong></span>
            <span style="margin-left:24px;font-size:1.1rem;"><i data-lucide="star" class="icon icon-sm"></i> 积分: <strong id="myPoints">-</strong></span>
            <a href="/checkin" class="btn btn-sm" style="margin-left:16px;"><i data-lucide="calendar-check" class="icon icon-sm"></i> 去签到赚金币</a>
        </div>

        <!-- 商品列表 -->
        <div id="shopGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;">
            <div class="loading">加载中</div>
        </div>

        <!-- 我的订单 -->
        <div style="margin-top:40px;" class="reveal">
            <h3 class="chapter-title" style="font-size:1.5rem;"><i data-lucide="package" class="icon"></i> 我的订单</h3>
            <div id="orderList" style="margin-top:16px;"><div class="loading">加载中</div></div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
onUserReady(function() {
    loadBalance();
    loadShopItems();
    if (currentUser) loadOrders();
});

function loadBalance() {
    if (!currentUser) return;
    api.get('/api/shop/coins').then(data => {
        document.getElementById('myCoins').textContent = data.coins || 0;
        document.getElementById('myPoints').textContent = data.points || 0;
    });
}

function loadShopItems() {
    api.get('/api/shop/items').then(items => {
        window._shopItemsCache = items || [];
        const grid = document.getElementById('shopGrid');
        if (!items.length) { grid.innerHTML = '<div class="empty-state">暂无商品</div>'; return; }
        grid.innerHTML = items.map(item => `
            <div class="station-card reveal" style="cursor:default;">
                <div style="text-align:center;font-size:2.5rem;margin-bottom:8px;">${item.icon}</div>
                <div style="font-family:'ZCOOL KuaiLe',cursive;font-size:1.1rem;text-align:center;margin-bottom:4px;">${escHtml(item.name)}</div>
                <div style="font-size:0.8rem;color:var(--text-secondary);text-align:center;margin-bottom:12px;">${escHtml(item.description)}</div>
                <div style="text-align:center;margin-bottom:12px;">
                    ${item.price_coins ? '<span style="color:var(--orange);font-weight:700;"><i data-lucide="coins" class="icon icon-sm"></i> '+item.price_coins+'</span>' : ''}
                    ${item.price_coins && item.price_points ? ' + ' : ''}
                    ${item.price_points ? '<span style="color:var(--mint);font-weight:700;"><i data-lucide="star" class="icon icon-sm"></i> '+item.price_points+'</span>' : ''}
                </div>
                <div style="text-align:center;">
                    <button class="btn btn-primary btn-sm" data-item-id="${item.id}" onclick="buyItemById(this)">兑换</button>
                </div>
                ${item.stock >= 0 ? '<div style="text-align:center;font-size:0.7rem;color:var(--text-muted);margin-top:8px;">库存: '+item.stock+'</div>' : ''}
            </div>
        `).join('');
        initReveal();
    });
}

function buyItemById(el) {
    const id = parseInt(el.dataset.itemId, 10);
    const items = window._shopItemsCache || [];
    const item = items.find(x => x.id === id);
    buyItem(id, item ? item.name : '该商品');
}

function buyItem(id, name) {
    if (!requireAuth()) return;
    if (!confirm('确定兑换「' + name + '」？')) return;
    api.post('/api/shop/buy', { item_id: id }).then(data => {
        showToast('兑换成功！', 'success');
        loadBalance();
        loadOrders();
    }).catch(e => showToast(e.message || '兑换失败', 'error'));
}

function loadOrders() {
    api.get('/api/shop/orders').then(orders => {
        const list = document.getElementById('orderList');
        if (!orders.length) { list.innerHTML = '<div style="color:var(--text-muted);">暂无订单</div>'; return; }
        const usableTypes = ['rename', 'rename_card', 'pin', 'pin_card', 'anonymous', 'anonymity_card', 'title', 'rainbow_name'];
        list.innerHTML = orders.map(o => {
            const usable = o.status === 'completed' && usableTypes.includes(o.item_type);
            return `
            <div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.05);">
                <span style="font-size:1.3rem;"><i data-lucide="${o.item_icon || 'gift'}" class="icon"></i></span>
                <div style="flex:1;">
                    <div style="font-weight:600;font-size:0.9rem;">${escHtml(o.item_name)}</div>
                    <div style="font-size:0.75rem;color:var(--text-muted);">${formatTime(o.created_at)}</div>
                </div>
                <div style="font-size:0.85rem;color:var(--text-secondary);">
                    ${o.total_coins ? '-'+o.total_coins+' <i data-lucide="coins" class="icon icon-sm"></i>' : ''} ${o.total_points ? '-'+o.total_points+' <i data-lucide="star" class="icon icon-sm"></i>' : ''}
                </div>
                ${usable ? '<button class="btn btn-primary btn-sm" style="padding:4px 12px;font-size:0.75rem;" onclick="useItemById('+o.item_id+')">使用</button>' : ''}
                ${o.status === 'used' ? '<span style="font-size:0.7rem;color:var(--text-muted);">已使用</span>' : ''}
            </div>`;
        }).join('');
    });
}

function useItemById(itemId) {
    if (!requireAuth()) return;
    // 需要知道 item_type 才能决定参数，先查商品
    api.get('/api/shop/items/' + itemId).then(item => {
        const t = item.item_type;
        if (t === 'rename' || t === 'rename_card') {
            const name = prompt('输入新用户名（2-30字符）:');
            if (!name) return;
            useItem(itemId, { new_name: name.trim() });
        } else if (t === 'pin' || t === 'pin_card') {
            const pid = prompt('输入要置顶的帖子ID:');
            if (!pid) return;
            useItem(itemId, { post_id: parseInt(pid) });
        } else if (t === 'anonymous' || t === 'anonymity_card') {
            useItem(itemId, {});
        } else if (t === 'title' || t === 'rainbow_name') {
            const title = prompt('输入你的称号（20字符内）:');
            if (!title) return;
            useItem(itemId, { title: title.trim() });
        } else {
            showToast('该道具暂不支持使用', 'error');
        }
    }).catch(() => showToast('加载道具失败', 'error'));
}

function useItem(itemId, extra) {
    api.post('/api/shop/use', { item_id: itemId, extra }).then(data => {
        showToast(data.message, 'success');
        loadOrders();
        loadBalance();
    }).catch(e => showToast(e.message || '使用失败', 'error'));
}
</script>
</body>
</html>

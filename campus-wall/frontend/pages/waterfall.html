<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瀑布流 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    <style>
.masonry {
    columns: 3;
    column-gap: 16px;
}
.masonry-item {
    break-inside: avoid;
    margin-bottom: 16px;
}
@media (max-width: 900px) { .masonry { columns: 2; } }
@media (max-width: 500px) { .masonry { columns: 1; } }

.masonry-card {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow-soft);
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
}
.masonry-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
}
.masonry-card .img-placeholder {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 10px;
    background: linear-gradient(135deg, var(--pink-1), var(--orange));
}
.masonry-card .title {
    font-family: 'ZCOOL KuaiLe', cursive;
    font-size: 1rem;
    margin-bottom: 6px;
}
.masonry-card .content {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.masonry-card .meta {
    display: flex;
    gap: 12px;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 10px;
    flex-wrap: wrap;
}
</style>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:1200px;">
        <div class="section-header reveal">
            <h2 class="chapter-title"><i data-lucide="waves" class="icon"></i> 瀑布流</h2>
            <p class="chapter-sub">刷不完的校园动态</p>
        </div>

        <!-- 排序 -->
        <div class="tag-bar reveal" id="waterfallSort">
            <span class="tag active" onclick="sortWaterfall(this,'newest')"><i data-lucide="sparkles" class="icon icon-sm"></i> 最新</span>
            <span class="tag" onclick="sortWaterfall(this,'hot')"><i data-lucide="flame" class="icon icon-sm"></i> 热门推荐</span>
        </div>

        <!-- 我关注的子站（来自 /api/recommend/interests，点击可筛选） -->
        <div id="interestBar" class="tag-bar reveal" style="display:none;"></div>

        <div id="waterfallGrid" class="masonry">
            <div class="loading">加载中</div>
        </div>

        <div style="text-align:center;margin-top:32px;">
            <button class="btn" id="loadMoreWaterfall" onclick="loadMoreWaterfall()" style="display:none;"><i data-lucide="chevrons-down" class="icon icon-sm"></i> 加载更多</button>
            <div id="waterfallEnd" style="display:none;color:var(--text-muted);font-family:'Ma Shan Zheng',cursive;"><i data-lucide="check-circle" class="icon icon-sm"></i> 已到底啦~</div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
let wfSort = 'newest';
let wfOffset = 0;
const wfLimit = 20;

const wfColors = [
    'linear-gradient(135deg, #FFB5BA, #FFD6A5)',
    'linear-gradient(135deg, #C9E4F5, #E2D5F5)',
    'linear-gradient(135deg, #B5EAD7, #C9E4F5)',
    'linear-gradient(135deg, #FDFFB6, #FFD6A5)',
    'linear-gradient(135deg, #E2D5F5, #FFB5BA)',
    'linear-gradient(135deg, #FFD6A5, #B5EAD7)',
];

document.addEventListener('DOMContentLoaded', function() {
    loadWaterfall();
    loadInterestStations();
});

// 我关注的子站（/api/recommend/interests）：作为快捷筛选栏展示
let wfStationId = null;
function loadInterestStations() {
    if (!currentUser) return;
    api.get('/api/recommend/interests').then(list => {
        const bar = document.getElementById('interestBar');
        if (!bar || !list || !list.length) return;
        const arr = Array.isArray(list) ? list : (list.stations || []);
        if (!arr.length) return;
        bar.style.display = '';
        bar.innerHTML = '<span class="tag active" data-sid="" onclick="filterByStation(this,\'\')">'
            + '<i data-lucide="layout-grid" class="icon icon-sm"></i> 全部</span>'
            + arr.map(s => `<span class="tag" data-sid="${s.id}" onclick="filterByStation(this,'${s.id}')">`
                + `<i data-lucide="${getStationIcon(s.icon)}" class="icon icon-sm"></i> ${escHtml(s.name)}</span>`).join('');
        if (window.lucide) lucide.createIcons();
    }).catch(() => {});
}

function filterByStation(el, sid) {
    document.querySelectorAll('#interestBar .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    wfStationId = sid || null;
    wfOffset = 0;
    document.getElementById('waterfallGrid').innerHTML = '';
    document.getElementById('waterfallEnd').style.display = 'none';
    loadWaterfall();
}

function sortWaterfall(el, sort) {
    document.querySelectorAll('#waterfallSort .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    wfSort = sort;
    wfOffset = 0;
    document.getElementById('waterfallGrid').innerHTML = '';
    document.getElementById('waterfallEnd').style.display = 'none';
    loadWaterfall();
}

function loadWaterfall(append) {
    if (!append) wfOffset = 0;
    const sidParam = wfStationId ? `&station_id=${encodeURIComponent(wfStationId)}` : '';
    const url = wfSort === 'hot'
        ? `/api/recommend/posts?limit=${wfLimit}&offset=${wfOffset}${sidParam}`
        : `/api/posts?limit=${wfLimit}&offset=${wfOffset}&sort=newest${sidParam}`;

    api.get(url).then(data => {
        // /api/posts 返回 {posts,total}；/api/recommend/posts 返回裸数组
        const posts = Array.isArray(data) ? data : ((data && data.posts) || []);
        const grid = document.getElementById('waterfallGrid');
        if (!posts.length && !append) {
            grid.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="waves" class="icon icon-lg"></i></div><div class="text">暂无动态</div></div>';
            if (window.lucide) lucide.createIcons();
            return;
        }

        const html = posts.map((p, i) => {
            const imgMatch = String(p.content || '').match(/!\[[^\]]*\]\(([^)]+)\)/);
            const coverUrl = imgMatch && /^\/static\//.test(imgMatch[1]) ? imgMatch[1] : '';
            const stationIcon = getStationIcon(p.station_icon || 'school');
            return `
                <div class="masonry-item reveal">
                    <div class="masonry-card" onclick="window.location.href='/post/${p.id}'">
                        ${coverUrl ? '<img class="post-image" src="'+escHtml(coverUrl)+'" alt="" loading="lazy" style="width:100%;height:auto;border-radius:12px;margin-bottom:8px;display:block;">' : ''}
                        <div class="title">${escHtml(p.title)}</div>
                        <div class="content">${renderContent(p.content, false)}</div>
                        <div class="meta">
                            <span>${escHtml(p.author_name)}</span>
                            <span><i data-lucide="${stationIcon}" class="icon icon-sm"></i> ${escHtml(p.station_name||'')}</span>
                            <span><i data-lucide="heart" class="icon icon-sm"></i> ${p.likes_count||0}</span>
                            <span><i data-lucide="message-circle" class="icon icon-sm"></i> ${p.comments_count||0}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        if (append) grid.insertAdjacentHTML('beforeend', html);
        else grid.innerHTML = html;

        wfOffset += posts.length;
        const btn = document.getElementById('loadMoreWaterfall');
        const end = document.getElementById('waterfallEnd');
        if (posts.length >= wfLimit) {
            btn.style.display = '';
            end.style.display = 'none';
        } else {
            btn.style.display = 'none';
            end.style.display = '';
        }
        initReveal();
        if (window.lucide) lucide.createIcons();
    });
}

function loadMoreWaterfall() {
    loadWaterfall(true);
}

// 无限滚动检测
let _wfLoading = false;
window.addEventListener('scroll', function() {
    if (_wfLoading) return;
    const btn = document.getElementById('loadMoreWaterfall');
    if (!btn || btn.style.display === 'none') return;
    const rect = btn.getBoundingClientRect();
    if (rect.top <= window.innerHeight + 200) {
        _wfLoading = true;
        loadWaterfall(true);
        setTimeout(() => { _wfLoading = false; }, 800);
    }
});
</script>
</body>
</html>

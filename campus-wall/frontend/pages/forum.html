<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公开论坛 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">

    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:1100px;">
        <div class="section-header reveal">
            <h2 class="chapter-title"><i data-lucide="messages-square" class="icon"></i> 公开论坛</h2>
            <p class="chapter-sub">全校公开讨论区 · 版块 + 最新热议一览</p>
        </div>

        <!-- 版块矩阵 -->
        <div id="forumBoards" class="reveal" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:28px;">
            <div class="loading">加载版块中</div>
        </div>

        <!-- 最新讨论 -->
        <div class="reveal">
            <h3 class="chapter-title" style="font-size:1.4rem;margin-bottom:14px;"><i data-lucide="radio" class="icon"></i> 论坛热议
                <span style="display:inline-flex;gap:6px;margin-left:14px;vertical-align:middle;">
                    <span class="tag active" id="forumSortNew" onclick="sortForum(this,'newest')"><i data-lucide="sparkles" class="icon icon-sm"></i> 最新</span>
                    <span class="tag" id="forumSortHot" onclick="sortForum(this,'popular')"><i data-lucide="flame" class="icon icon-sm"></i> 最热</span>
                </span>
            </h3>
            <div id="forumFeed"><div class="loading">加载中</div></div>
            <div style="text-align:center;margin-top:12px;"><button class="btn" id="forumMore" onclick="loadMoreFeed()" style="display:none;"><i data-lucide="chevrons-down" class="icon icon-sm"></i> 加载更多</button></div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
onUserReady(function () {
    loadBoards();
    loadFeed();
});

function loadBoards() {
    api.get('/api/stations?limit=100').then(list => {
        const grid = document.getElementById('forumBoards');
        const publicBoards = (Array.isArray(list) ? list : []).filter(s => s.is_public !== 0);
        if (!publicBoards.length) { grid.innerHTML = '<div style="color:var(--text-muted);">暂无公开版块</div>'; return; }
        grid.innerHTML = publicBoards.map(s => `
            <a href="/station/${s.id}" class="post-card reveal" style="display:block;text-decoration:none;color:inherit;padding:16px 18px;">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                    <span style="font-size:1.4rem;"><i data-lucide="${getStationIcon(s.icon)}" class="icon"></i></span>
                    <div>
                        <div style="font-weight:700;font-size:1.02rem;">${escHtml(s.name)}</div>
                        <div style="font-size:0.72rem;color:var(--text-muted);">${s.post_count || 0} 帖</div>
                    </div>
                </div>
                <div style="font-size:0.82rem;color:var(--text-secondary);line-height:1.6;">${escHtml(s.description || '')}</div>
            </a>`).join('');
        if (window.lucide) lucide.createIcons();
    }).catch(() => grid.innerHTML = '<div style="color:var(--text-muted);">版块加载失败</div>');
}

let forumSort = 'newest';
let forumOffset = 0;
const FORUM_LIMIT = 30;

function sortForum(el, sort) {
    document.querySelectorAll('#forumSortNew,#forumSortHot').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    forumSort = sort;
    forumOffset = 0;
    document.getElementById('forumFeed').innerHTML = '<div class="loading">加载中</div>';
    document.getElementById('forumMore').style.display = 'none';
    loadFeed();
}

function loadMoreFeed() { forumOffset += FORUM_LIMIT; loadFeed(true); }

function loadFeed(append) {
    if (!append) forumOffset = 0;
    api.get(`/api/posts?limit=${FORUM_LIMIT}&offset=${forumOffset}&sort=${forumSort}`).then(d => {
        const posts = (d && d.posts) || [];
        const feed = document.getElementById('forumFeed');
        if (!posts.length && !append) { feed.innerHTML = '<div style="color:var(--text-muted);">还没有讨论</div>'; return; }
        const html = posts.map(p => `
            <a href="/post/${p.id}" class="post-card reveal" style="display:block;text-decoration:none;color:inherit;padding:14px 18px;margin-bottom:12px;">
                <div style="display:flex;align-items:center;gap:10px;">
                    <i data-lucide="${getStationIcon(p.station_icon || 'school')}" class="icon" style="flex-shrink:0;"></i>
                    <div style="flex:1;min-width:0;">
                        <div style="font-weight:600;font-size:0.96rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(p.title)}</div>
                        <div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">
                            ${escHtml(p.author_name || '匿名')} · ${escHtml(p.station_name || '')} · ${formatTime(p.created_at)}
                        </div>
                    </div>
                    <div style="text-align:right;font-size:0.75rem;color:var(--text-muted);flex-shrink:0;">
                        <div><i data-lucide="heart" class="icon icon-sm"></i> ${p.likes_count || 0}</div>
                        <div><i data-lucide="message-circle" class="icon icon-sm"></i> ${p.comments_count || 0}</div>
                    </div>
                </div>
            </a>`).join('');
        if (append) feed.insertAdjacentHTML('beforeend', html); else feed.innerHTML = html;
        document.getElementById('forumMore').style.display = posts.length >= FORUM_LIMIT ? 'block' : 'none';
        if (window.lucide) lucide.createIcons();
    }).catch(() => { if (!append) feed.innerHTML = '<div style="color:var(--text-muted);">讨论加载失败</div>'; });
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统后台 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:1100px;">
        <div class="section-header reveal">
            <h2 class="chapter-title"><i data-lucide="settings" class="icon"></i> 系统后台</h2>
            <p class="chapter-sub">数据总览与管理</p>
        </div>

        <!-- 标签 -->
        <div class="tag-bar reveal" id="adminTabs">
            <span class="tag active" onclick="switchAdminTab(this,'dashboard')"><i data-lucide="layout-dashboard" class="icon icon-sm"></i> 仪表盘</span>
            <span class="tag" onclick="switchAdminTab(this,'users')"><i data-lucide="users" class="icon icon-sm"></i> 用户管理</span>
            <span class="tag" onclick="switchAdminTab(this,'stations')"><i data-lucide="building-2" class="icon icon-sm"></i> 子站管理</span>
            <span class="tag" onclick="switchAdminTab(this,'posts')"><i data-lucide="file-text" class="icon icon-sm"></i> 帖子管理</span>
            <span class="tag" onclick="switchAdminTab(this,'groups')"><i data-lucide="shield" class="icon icon-sm"></i> 身份组</span>
            <span class="tag" onclick="switchAdminTab(this,'shop')"><i data-lucide="gift" class="icon icon-sm"></i> 商城管理</span>
            <span class="tag" onclick="switchAdminTab(this,'reports')"><i data-lucide="flag" class="icon icon-sm"></i> 举报中心</span>
            <span class="tag" onclick="switchAdminTab(this,'logs')"><i data-lucide="scroll" class="icon icon-sm"></i> 操作日志</span>
        </div>

        <div id="adminContent"><div class="loading">加载中</div></div>
    </div>
</div>
    </main>
</div>
<script>
onUserReady(function() {
    if (!currentUser || currentUser.role !== 'admin') {
        document.getElementById('adminContent').innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="lock" class="icon icon-lg"></i></div><div class="text">需要管理员权限</div></div>';
        return;
    }
    switchAdminTab(document.querySelector('#adminTabs .tag'), 'dashboard');
});

function loadStatsChart(el, days) {
    document.querySelectorAll('#adminContent .tag').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    if (typeof Chart === 'undefined') return;
    api.get('/api/admin/stats/series?days=' + days).then(s => {
        const ctx = document.getElementById('adminStatsChart');
        if (!ctx) return;
        if (window._adminChart) window._adminChart.destroy();
        window._adminChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: s.labels,
                datasets: [
                    { label: '新增用户', data: s.users, borderColor: '#fb6f92', backgroundColor: 'rgba(251,111,146,0.12)', fill: true, tension: 0.4, pointRadius: 3 },
                    { label: '新帖子', data: s.posts, borderColor: '#002fa7', backgroundColor: 'rgba(0,47,167,0.08)', fill: true, tension: 0.4, pointRadius: 3 },
                    { label: '新评论', data: s.comments, borderColor: '#ffd6a5', backgroundColor: 'rgba(255,214,165,0.12)', fill: true, tension: 0.4, pointRadius: 3 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { font: { family: 'Nunito, Noto Sans SC', size: 12 } } }
                },
                scales: {
                    x: { grid: { display: false } },
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                }
            }
        });
    }).catch(() => {});
}

function switchAdminTab(el, tab) {
    document.querySelectorAll('#adminTabs .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const content = document.getElementById('adminContent');
    content.innerHTML = '<div class="loading">加载中</div>';

    if (tab === 'dashboard') {
        api.get('/api/admin/stats').then(s => {
            content.innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;" class="reveal">
                    ${[
                        'users|users|用户|'+s.users,
                        'stations|building-2|子站|'+s.stations,
                        'posts|file-text|帖子|'+s.posts,
                        'comments|message-circle|评论|'+s.comments,
                        'today_posts|calendar|今日帖子|'+s.today_posts,
                        'today_users|user-plus|今日注册|'+s.today_users
                    ].map(item => {
                        const [key, icon, label, val] = item.split('|');
                        return '<div class="station-card" style="text-align:center;padding:20px;cursor:default;"><div style="font-size:1.8rem;font-weight:800;"><i data-lucide="'+icon+'" class="icon"></i> '+val+'</div><div style="font-size:0.8rem;color:var(--text-muted);">'+label+'</div></div>';
                    }).join('')}
                </div>
                <div style="display:flex;gap:8px;margin:20px 0 12px;">
                    ${[7,14,30].map(d => '<span class="tag '+(d===7?'active':'')+'" onclick="loadStatsChart(this,'+d+')">近'+d+'天</span>').join('')}
                </div>
                <div class="reveal" style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;">
                    <canvas id="adminStatsChart" height="120"></canvas>
                </div>
            `;
            initReveal();
            if (window.lucide) lucide.createIcons();
            loadStatsChart(document.querySelector('#adminContent .tag.active'), 7);
        });
    } else if (tab === 'users') {        api.get('/api/admin/users').then(users => {
            api.get('/api/admin/identity-groups').then(groups => {
                content.innerHTML = `
                    <div style="overflow-x:auto;">
                    <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                        <tr style="background:var(--pink-1);"><th style="padding:8px;text-align:left;">ID</th><th>用户名</th><th>角色</th><th>身份组</th><th><i data-lucide="coins" class="icon icon-sm"></i> 金币</th><th><i data-lucide="star" class="icon icon-sm"></i> 积分</th><th>等级</th><th>注册时间</th><th>操作</th></tr>
                        ${users.map(u => `
                            <tr style="border-bottom:1px solid rgba(0,0,0,0.05);">
                                <td style="padding:8px;">${u.id}</td>
                                <td><a href="/profile/${u.id}">${escHtml(u.username)}</a></td>
                                <td>
                                    <select class="input" style="width:auto;padding:2px 6px;font-size:0.75rem;" onchange="setUserField(${u.id},'role',this.value)">
                                        <option value="user" ${u.role==='user'?'selected':''}>user</option>
                                        <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
                                    </select>
                                </td>
                                <td>
                                    <select class="input" style="width:auto;padding:2px 6px;font-size:0.75rem;" onchange="setUserField(${u.id},'identity_group',this.value)">
                                        <option value="">无</option>
                                        ${(groups||[]).map(g => '<option value="'+escHtml(g.name)+'" '+(u.identity_group===g.name?'selected':'')+'>'+escHtml(g.name)+'</option>').join('')}
                                    </select>
                                </td>
                                <td><input class="input" style="width:60px;padding:2px 6px;font-size:0.75rem;" value="${u.coins||0}" onchange="setUserField(${u.id},'coins',this.value)"></td>
                                <td><input class="input" style="width:60px;padding:2px 6px;font-size:0.75rem;" value="${u.points||0}" onchange="setUserField(${u.id},'points',this.value)"></td>
                                <td><input class="input" style="width:50px;padding:2px 6px;font-size:0.75rem;" value="${u.level||1}" onchange="setUserField(${u.id},'level',this.value)"></td>
                                <td style="font-size:0.7rem;">${formatTime(u.created_at)}</td>
                                <td><a href="/profile/${u.id}" class="btn btn-ghost btn-sm" style="padding:2px 10px;font-size:0.7rem;">查看</a></td>
                            </tr>
                        `).join('')}
                    </table>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
            });
        });
    } else if (tab === 'stations') {
        api.get('/api/admin/stations').then(stations => {
            content.innerHTML = stations.map(s => `
                <div class="station-card" style="padding:16px;cursor:default;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:1.3rem;"><i data-lucide="${getStationIcon(s.icon||'school')}" class="icon"></i></span>
                        <strong><a href="/station/${s.id}" style="color:var(--text-dark);text-decoration:none;">${escHtml(s.name)}</a></strong>
                        <span style="font-size:0.7rem;color:var(--text-muted);"><i data-lucide="users" class="icon icon-sm"></i> ${s.user_count||0} <i data-lucide="file-text" class="icon icon-sm"></i> ${s.post_count||0}</span>
                        <span style="flex:1;"></span>
                        <a href="/station/${s.id}" class="btn btn-ghost btn-sm" style="padding:2px 10px;font-size:0.7rem;">管理</a>
                        <button class="btn btn-ghost btn-sm" style="padding:2px 10px;font-size:0.7rem;color:var(--pink-4);" onclick="deleteStationAdmin(${s.id})">删除</button>
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'posts') {
        api.get('/api/admin/posts').then(posts => {
            content.innerHTML = `
                <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                    <tr style="background:var(--pink-1);"><th style="padding:8px;text-align:left;">ID</th><th>标题</th><th>作者</th><th>子站</th><th>置顶</th><th>操作</th></tr>
                    ${posts.map(p => `
                        <tr style="border-bottom:1px solid rgba(0,0,0,0.05);">
                            <td style="padding:8px;">${p.id}</td>
                            <td><a href="/post/${p.id}" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;">${escHtml(p.title)}</a></td>
                            <td>${escHtml(p.author_name)}</td>
                            <td>${escHtml(p.station_name)}</td>
                            <td>${p.is_pinned?'<i data-lucide=\"pin\" class=\"icon icon-sm\"></i>':''}</td>
                            <td>
                                <button class="btn btn-ghost btn-sm" onclick="pinPost(${p.id})">${p.is_pinned?'取消置顶':'置顶'}</button>
                                <button class="btn btn-ghost btn-sm" onclick="deletePostAdmin(${p.id})" style="color:var(--pink-4);">删除</button>
                            </td>
                        </tr>
                    `).join('')}
                </table>
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'groups') {
        api.get('/api/admin/identity-groups').then(groups => {
            content.innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;">
                    ${groups.map(g => `
                        <div class="station-card" style="cursor:default;">
                            <div style="font-size:1.5rem;text-align:center;">${g.icon}</div>
                            <div style="font-family:'ZCOOL KuaiLe',cursive;text-align:center;">${escHtml(g.name)}</div>
                            <div style="font-size:0.8rem;color:var(--text-secondary);text-align:center;">${escHtml(g.description)}</div>
                            <div style="text-align:center;font-size:0.7rem;color:var(--text-muted);">最低等级: ${g.min_level}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        });
    } else if (tab === 'shop') {
        api.get('/api/shop/items').then(items => {
            content.innerHTML = `
                <div style="margin-bottom:20px;text-align:right;">
                    <button class="btn btn-primary btn-sm" onclick="openCreateShopItem()"><i data-lucide="plus" class="icon icon-sm"></i> 创建商品</button>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;">
                    ${items.map(i => `
                        <div class="station-card" style="cursor:default;text-align:center;">
                            <div style="font-size:2rem;">${i.icon}</div>
                            <div style="font-family:'ZCOOL KuaiLe',cursive;">${escHtml(i.name)}</div>
                            <div style="font-size:0.8rem;color:var(--text-secondary);">${escHtml(i.description)}</div>
                            <div style="font-size:0.85rem;font-weight:700;margin-top:4px;">${i.price_coins?'<i data-lucide=\"coins\" class=\"icon icon-sm\"></i> '+i.price_coins:''} ${i.price_points?'<i data-lucide=\"star\" class=\"icon icon-sm\"></i> '+i.price_points:''}</div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">库存: ${i.stock<0?'无限':i.stock} · ${i.is_active?'上架中':'已下架'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'reports') {
        api.get('/api/reports?status=pending').then(reports => {
            if (!reports.length) { content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="flag" class="icon icon-lg"></i></div><div class="text">暂无待处理举报</div></div>'; return; }
            const typeMap = { post: '帖子', comment: '评论', user: '用户', gossip: '树洞', trade: '交易' };
            content.innerHTML = reports.map(r => `
                <div class="station-card" style="padding:16px;cursor:default;margin-bottom:12px;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <span style="font-size:1.1rem;"><i data-lucide="flag" class="icon icon-sm icon-danger"></i></span>
                        <strong>${typeMap[r.target_type]||r.target_type} #${r.target_id}</strong>
                        <span style="font-size:0.7rem;color:var(--pink-4);background:var(--pink-1);padding:2px 8px;border-radius:8px;">${escHtml(r.reason)}</span>
                        <span style="font-size:0.75rem;color:var(--text-muted);">举报人: ${escHtml(r.reporter_name||'-')}</span>
                        <span style="font-size:0.7rem;color:var(--text-muted);margin-left:auto;">${formatTime(r.created_at)}</span>
                    </div>
                    ${r.detail ? '<div style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px;">'+escHtml(r.detail)+'</div>' : ''}
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <a href="/post/${r.target_type==='post'?r.target_id:''}" class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;" onclick="${r.target_type!=='post'?'event.preventDefault();showToast(\'仅帖子可跳转查看\');':''}">查看</a>
                        <button class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;color:var(--danger);" onclick="handleReport(${r.id},'approved')">确认违规</button>
                        <button class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;" onclick="handleReport(${r.id},'rejected')">驳回</button>
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'logs') {
        api.get('/api/admin/logs').then(logs => {
            if (!logs.length) { content.innerHTML = '<div class="empty-state">暂无日志</div>'; return; }
            content.innerHTML = logs.map(l => `
                <div style="padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.05);font-size:0.85rem;">
                    <span style="font-weight:600;">${escHtml(l.admin_name||'系统')}</span>
                    <span style="color:var(--pink-4);"> ${escHtml(l.action)} </span>
                    <span style="color:var(--text-secondary);">${escHtml(l.target_type)} #${l.target_id}</span>
                    <span style="font-size:0.7rem;color:var(--text-muted);margin-left:8px;">${formatTime(l.created_at)}</span>
                    ${l.detail ? '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">'+escHtml(l.detail)+'</div>' : ''}
                </div>
            `).join('');
        });
    }
}

function setUserField(uid, field, value) {
    const body = {};
    if (field === 'coins' || field === 'points' || field === 'level') value = parseInt(value) || 0;
    body[field] = value;
    api.put('/api/admin/users/' + uid, body).then(() => showToast('已更新', 'success')).catch(e => showToast(e.message, 'error'));
}

function deleteStationAdmin(sid) {
    if (!confirm('确定删除该子站？')) return;
    if (!confirm('再次确认：子站及成员关系将永久删除。')) return;
    api.delete('/api/stations/' + sid).then(() => { showToast('已删除', 'success'); switchAdminTab(document.querySelector('#adminTabs .tag'), 'stations'); }).catch(e => showToast(e.message, 'error'));
}

function handleReport(rid, status) {
    const label = status === 'approved' ? '确认违规' : '驳回';
    if (!confirm('确定' + label + '该举报？')) return;
    api.put('/api/reports/' + rid, { status }).then(() => { showToast('已处理', 'success'); switchAdminTab(document.querySelector('#adminTabs .tag'), 'reports'); }).catch(e => showToast(e.message, 'error'));
}

function pinPost(pid) {
    api.post('/api/admin/posts/' + pid + '/pin').then(d => showToast(d.message, 'success')).catch(e => showToast(e.message, 'error'));
}

function deletePostAdmin(pid) {
    if (!confirm('确定删除？')) return;
    api.delete('/api/admin/posts/' + pid).then(() => showToast('已删除', 'success')).catch(e => showToast(e.message, 'error'));
}

function openCreateShopItem() {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay show';
    modal.innerHTML = `
        <div class="modal" style="max-width:480px;position:relative;">
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            <h3 style="font-family:'ZCOOL KuaiLe',cursive;margin-bottom:16px;"><i data-lucide="gift" class="icon icon-sm"></i> 创建商城商品</h3>
            <form onsubmit="createShopItem(event,this)">
                <input class="input" name="name" placeholder="商品名称" required style="margin-bottom:10px;">
                <input class="input" name="description" placeholder="商品描述" style="margin-bottom:10px;">
                <input class="input" name="icon" placeholder="图标（如 medal）" value="gift" style="margin-bottom:10px;">
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <input class="input" name="price_coins" type="number" placeholder="价格(金币)" value="0" style="flex:1;">
                    <input class="input" name="price_points" type="number" placeholder="价格(积分)" value="0" style="flex:1;">
                </div>
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <select class="input" name="item_type" style="flex:1;">
                        <option value="badge">徽章</option>
                        <option value="title">称号</option>
                        <option value="rename_card">改名卡</option>
                        <option value="pin_card">置顶卡</option>
                        <option value="anonymity_card">匿名卡</option>
                        <option value="rainbow_name">彩虹昵称</option>
                    </select>
                    <input class="input" name="stock" type="number" placeholder="库存(-1=无限)" value="-1" style="flex:1;">
                </div>
                <div style="display:flex;gap:8px;justify-content:flex-end;">
                    <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

function createShopItem(e, form) {
    e.preventDefault();
    api.post('/api/admin/shop/items', {
        name: form.name.value.trim(),
        description: form.description.value.trim(),
        icon: form.icon.value.trim() || 'gift',
        price_coins: parseInt(form.price_coins.value) || 0,
        price_points: parseInt(form.price_points.value) || 0,
        item_type: form.item_type.value,
        stock: parseInt(form.stock.value) || -1,
        item_data: { type: form.item_type.value }
    }).then(() => {
        showToast('创建成功', 'success');
        document.querySelector('.modal-overlay').remove();
        switchAdminTab(document.querySelector('#adminTabs .tag'), 'shop');
    }).catch(e => showToast(e.message || '创建失败', 'error'));
    return false;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统后台 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:1100px;">
        <div class="section-header reveal">
            <h2 class="chapter-title"><i data-lucide="settings" class="icon"></i> 系统后台</h2>
            <p class="chapter-sub">数据总览与管理</p>
        </div>

        <!-- 标签 -->
        <div class="tag-bar reveal" id="adminTabs">
            <span class="tag active" data-tab="dashboard" onclick="adminTab('dashboard')"><i data-lucide="layout-dashboard" class="icon icon-sm"></i> 仪表盘</span>
            <span class="tag" data-tab="users" onclick="adminTab('users')"><i data-lucide="users" class="icon icon-sm"></i> 用户管理</span>
            <span class="tag" data-tab="stations" onclick="adminTab('stations')"><i data-lucide="building-2" class="icon icon-sm"></i> 子站管理</span>
            <span class="tag" data-tab="posts" onclick="adminTab('posts')"><i data-lucide="file-text" class="icon icon-sm"></i> 帖子管理</span>
            <span class="tag" data-tab="review" onclick="adminTab('review')"><i data-lucide="clipboard-check" class="icon icon-sm"></i> 帖子审核</span>
            <span class="tag" data-tab="groups" onclick="adminTab('groups')"><i data-lucide="shield" class="icon icon-sm"></i> 身份组</span>
            <span class="tag" data-tab="shop" onclick="adminTab('shop')"><i data-lucide="gift" class="icon icon-sm"></i> 商城管理</span>
            <span class="tag" data-tab="reports" onclick="adminTab('reports')"><i data-lucide="flag" class="icon icon-sm"></i> 举报中心</span>
            <span class="tag" data-tab="announcements" onclick="adminTab('announcements')"><i data-lucide="megaphone" class="icon icon-sm"></i> 公告管理</span>
            <span class="tag" data-tab="ads" onclick="adminTab('ads')"><i data-lucide="megaphone" class="icon icon-sm"></i> 广告位</span>
            <span class="tag" data-tab="topics" onclick="adminTab('topics')"><i data-lucide="hash" class="icon icon-sm"></i> 话题</span>
            <span class="tag" data-tab="tasks" onclick="adminTab('tasks')"><i data-lucide="target" class="icon icon-sm"></i> 任务</span>
            <span class="tag" data-tab="logs" onclick="adminTab('logs')"><i data-lucide="scroll" class="icon icon-sm"></i> 操作日志</span>
        </div>

        <div id="adminContent"><div class="loading">加载中</div></div>
    </div>
</div>
    </main>
</div>
<script>
onUserReady(function() {
    if (!currentUser || currentUser.role !== 'admin') {
        document.getElementById('adminContent').innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="lock" class="icon icon-lg"></i></div><div class="text">需要管理员权限</div></div>';
        return;
    }
    adminTab('dashboard');
});

function loadStatsChart(el, days) {
    document.querySelectorAll('#adminContent .tag').forEach(t => t.classList.remove('active'));
    if (el) el.classList.add('active');
    if (typeof Chart === 'undefined') return;
    api.get('/api/admin/stats/series?days=' + days).then(s => {
        const ctx = document.getElementById('adminStatsChart');
        if (!ctx) return;
        if (window._adminChart) window._adminChart.destroy();
        window._adminChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: s.labels,
                datasets: [
                    { label: '新增用户', data: s.users, borderColor: '#fb6f92', backgroundColor: 'rgba(251,111,146,0.12)', fill: true, tension: 0.4, pointRadius: 3 },
                    { label: '新帖子', data: s.posts, borderColor: '#002fa7', backgroundColor: 'rgba(0,47,167,0.08)', fill: true, tension: 0.4, pointRadius: 3 },
                    { label: '新评论', data: s.comments, borderColor: '#ffd6a5', backgroundColor: 'rgba(255,214,165,0.12)', fill: true, tension: 0.4, pointRadius: 3 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { font: { family: 'Nunito, Noto Sans SC', size: 12 } } }
                },
                scales: {
                    x: { grid: { display: false } },
                    y: { beginAtZero: true, ticks: { precision: 0 } }
                }
            }
        });
    }).catch(() => {});
}

function adminTab(name) { const el = document.querySelector("#adminTabs .tag[data-tab='" + name + "']"); if (el) switchAdminTab(el, name); }

function switchAdminTab(el, tab) {
    document.querySelectorAll('#adminTabs .tag').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    const content = document.getElementById('adminContent');
    content.innerHTML = '<div class="loading">加载中</div>';

    if (tab === 'dashboard') {
        api.get('/api/admin/stats').then(s => {
            content.innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;" class="reveal">
                    ${[
                        'users|users|用户|'+s.users,
                        'stations|building-2|子站|'+s.stations,
                        'posts|file-text|帖子|'+s.posts,
                        'comments|message-circle|评论|'+s.comments,
                        'today_posts|calendar|今日帖子|'+s.today_posts,
                        'today_users|user-plus|今日注册|'+s.today_users
                    ].map(item => {
                        const [key, icon, label, val] = item.split('|');
                        return '<div class="station-card" style="text-align:center;padding:20px;cursor:default;"><div style="font-size:1.8rem;font-weight:800;"><i data-lucide="'+icon+'" class="icon"></i> '+val+'</div><div style="font-size:0.8rem;color:var(--text-muted);">'+label+'</div></div>';
                    }).join('')}
                </div>
                <div style="display:flex;gap:8px;margin:20px 0 12px;">
                    ${[7,14,30].map(d => '<span class="tag '+(d===7?'active':'')+'" onclick="loadStatsChart(this,'+d+')">近'+d+'天</span>').join('')}
                </div>
                <div class="reveal" style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;">
                    <canvas id="adminStatsChart" height="120"></canvas>
                </div>
            `;
            initReveal();
            if (window.lucide) lucide.createIcons();
            loadStatsChart(document.querySelector('#adminContent .tag.active'), 7);
        });
    } else if (tab === 'users') {        api.get('/api/admin/users').then(users => {
            api.get('/api/admin/identity-groups').then(groups => {
                content.innerHTML = `
                    <div style="overflow-x:auto;">
                    <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                        <tr style="background:var(--pink-1);"><th style="padding:8px;text-align:left;">ID</th><th>用户名</th><th>角色</th><th>身份组</th><th><i data-lucide="coins" class="icon icon-sm"></i> 金币</th><th><i data-lucide="star" class="icon icon-sm"></i> 积分</th><th>等级</th><th>注册时间</th><th>操作</th></tr>
                        ${users.map(u => `
                            <tr style="border-bottom:1px solid rgba(0,0,0,0.05);">
                                <td style="padding:8px;">${u.id}</td>
                                <td><a href="/profile/${u.id}">${escHtml(u.username)}</a></td>
                                <td>
                                    <select class="input" style="width:auto;padding:2px 6px;font-size:0.75rem;" onchange="setUserField(${u.id},'role',this.value)">
                                        <option value="user" ${u.role==='user'?'selected':''}>user</option>
                                        <option value="admin" ${u.role==='admin'?'selected':''}>admin</option>
                                    </select>
                                </td>
                                <td>
                                    <select class="input" style="width:auto;padding:2px 6px;font-size:0.75rem;" onchange="setUserField(${u.id},'identity_group',this.value)">
                                        <option value="">无</option>
                                        ${(groups||[]).map(g => '<option value="'+escHtml(g.name)+'" '+(u.identity_group===g.name?'selected':'')+'>'+escHtml(g.name)+'</option>').join('')}
                                    </select>
                                </td>
                                <td><input class="input" style="width:60px;padding:2px 6px;font-size:0.75rem;" value="${u.coins||0}" onchange="setUserField(${u.id},'coins',this.value)"></td>
                                <td><input class="input" style="width:60px;padding:2px 6px;font-size:0.75rem;" value="${u.points||0}" onchange="setUserField(${u.id},'points',this.value)"></td>
                                <td><input class="input" style="width:50px;padding:2px 6px;font-size:0.75rem;" value="${u.level||1}" onchange="setUserField(${u.id},'level',this.value)"></td>
                                <td style="font-size:0.7rem;">${formatTime(u.created_at)}</td>
                                <td><a href="/profile/${u.id}" class="btn btn-ghost btn-sm" style="padding:2px 10px;font-size:0.7rem;">查看</a></td>
                            </tr>
                        `).join('')}
                    </table>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();
            });
        });
    } else if (tab === 'stations') {
        api.get('/api/admin/stations').then(stations => {
            content.innerHTML = stations.map(s => `
                <div class="station-card" style="padding:16px;cursor:default;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:1.3rem;"><i data-lucide="${getStationIcon(s.icon||'school')}" class="icon"></i></span>
                        <strong><a href="/station/${s.id}" style="color:var(--text-dark);text-decoration:none;">${escHtml(s.name)}</a></strong>
                        <span style="font-size:0.7rem;color:var(--text-muted);"><i data-lucide="users" class="icon icon-sm"></i> ${s.user_count||0} <i data-lucide="file-text" class="icon icon-sm"></i> ${s.post_count||0}</span>
                        <span style="flex:1;"></span>
                        <a href="/station/${s.id}" class="btn btn-ghost btn-sm" style="padding:2px 10px;font-size:0.7rem;">管理</a>
                        <button class="btn btn-ghost btn-sm" style="padding:2px 10px;font-size:0.7rem;color:var(--pink-4);" onclick="deleteStationAdmin(${s.id})">删除</button>
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'posts') {
        api.get('/api/admin/posts').then(posts => {
            content.innerHTML = `
                <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                    <tr style="background:var(--pink-1);"><th style="padding:8px;text-align:left;">ID</th><th>标题</th><th>作者</th><th>子站</th><th>置顶</th><th>操作</th></tr>
                    ${posts.map(p => `
                        <tr style="border-bottom:1px solid rgba(0,0,0,0.05);">
                            <td style="padding:8px;">${p.id}</td>
                            <td><a href="/post/${p.id}" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;">${escHtml(p.title)}</a></td>
                            <td>${escHtml(p.author_name)}</td>
                            <td>${escHtml(p.station_name)}</td>
                            <td>${p.is_pinned?'<i data-lucide=\"pin\" class=\"icon icon-sm\"></i>':''}</td>
                            <td>
                                <button class="btn btn-ghost btn-sm" onclick="pinPost(${p.id})">${p.is_pinned?'取消置顶':'置顶'}</button>
                                <button class="btn btn-ghost btn-sm" onclick="deletePostAdmin(${p.id})" style="color:var(--pink-4);">删除</button>
                            </td>
                        </tr>
                    `).join('')}
                </table>
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'groups') {
        api.get('/api/admin/identity-groups').then(groups => {
            content.innerHTML = `
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;">
                    ${groups.map(g => `
                        <div class="station-card" style="cursor:default;">
                            <div style="font-size:1.5rem;text-align:center;">${g.icon}</div>
                            <div style="font-family:'ZCOOL KuaiLe',cursive;text-align:center;">${escHtml(g.name)}</div>
                            <div style="font-size:0.8rem;color:var(--text-secondary);text-align:center;">${escHtml(g.description)}</div>
                            <div style="text-align:center;font-size:0.7rem;color:var(--text-muted);">最低等级: ${g.min_level}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        });
    } else if (tab === 'shop') {
        api.get('/api/shop/items').then(items => {
            content.innerHTML = `
                <div style="margin-bottom:20px;text-align:right;">
                    <button class="btn btn-primary btn-sm" onclick="openCreateShopItem()"><i data-lucide="plus" class="icon icon-sm"></i> 创建商品</button>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;">
                    ${items.map(i => `
                        <div class="station-card" style="cursor:default;text-align:center;">
                            <div style="font-size:2rem;">${i.icon}</div>
                            <div style="font-family:'ZCOOL KuaiLe',cursive;">${escHtml(i.name)}</div>
                            <div style="font-size:0.8rem;color:var(--text-secondary);">${escHtml(i.description)}</div>
                            <div style="font-size:0.85rem;font-weight:700;margin-top:4px;">${i.price_coins?'<i data-lucide=\"coins\" class=\"icon icon-sm\"></i> '+i.price_coins:''} ${i.price_points?'<i data-lucide=\"star\" class=\"icon icon-sm\"></i> '+i.price_points:''}</div>
                            <div style="font-size:0.7rem;color:var(--text-muted);">库存: ${i.stock<0?'无限':i.stock} · ${i.is_active?'上架中':'已下架'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'review') {
        api.get('/api/admin/review').then(d => {
            const posts = (d && d.posts) || [];
            if (!posts.length) { content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="clipboard-check" class="icon icon-lg"></i></div><div class="text">没有待审核的帖子</div></div>'; if (window.lucide) lucide.createIcons(); return; }
            content.innerHTML = posts.map(p => `
                <div class="station-card" style="padding:16px;cursor:default;margin-bottom:12px;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <strong>${escHtml(p.title)}</strong>
                        <span style="font-size:0.7rem;color:var(--pink-4);background:var(--pink-1);padding:2px 8px;border-radius:8px;">${escHtml(p.station_name||'')}</span>
                        <span style="font-size:0.72rem;color:var(--text-muted);">作者: ${escHtml(p.author_name||'-')}</span>
                        ${p.is_anonymous ? '<span style="font-size:0.7rem;color:#b45309;background:#fef3c7;padding:2px 8px;border-radius:8px;">匿名帖</span>' : ''}
                        <span style="font-size:0.7rem;color:var(--text-muted);margin-left:auto;">${formatTime(p.created_at)}</span>
                    </div>
                    <div style="font-size:0.85rem;color:var(--text-secondary);margin-top:8px;max-height:140px;overflow:auto;white-space:pre-wrap;">${escHtml((p.content||'').slice(0,500))}</div>
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <a href="/post/${p.id}" class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;">查看</a>
                        <button class="btn btn-primary btn-sm" style="padding:3px 12px;font-size:0.75rem;" onclick="reviewPost(${p.id},'approve')">通过</button>
                        <button class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;color:var(--danger);" onclick="reviewPost(${p.id},'reject')">驳回</button>
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'reports') {
        api.get('/api/reports?status=pending').then(reports => {
            if (!reports.length) { content.innerHTML = '<div class="empty-state"><div class="icon"><i data-lucide="flag" class="icon icon-lg"></i></div><div class="text">暂无待处理举报</div></div>'; return; }
            const typeMap = { post: '帖子', comment: '评论', user: '用户', gossip: '树洞', trade: '交易' };
            content.innerHTML = reports.map(r => `
                <div class="station-card" style="padding:16px;cursor:default;margin-bottom:12px;">
                    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                        <span style="font-size:1.1rem;"><i data-lucide="flag" class="icon icon-sm icon-danger"></i></span>
                        <strong>${typeMap[r.target_type]||r.target_type} #${r.target_id}</strong>
                        <span style="font-size:0.7rem;color:var(--pink-4);background:var(--pink-1);padding:2px 8px;border-radius:8px;">${escHtml(r.reason)}</span>
                        <span style="font-size:0.75rem;color:var(--text-muted);">举报人: ${escHtml(r.reporter_name||'-')}</span>
                        <span style="font-size:0.7rem;color:var(--text-muted);margin-left:auto;">${formatTime(r.created_at)}</span>
                    </div>
                    ${r.detail ? '<div style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px;">'+escHtml(r.detail)+'</div>' : ''}
                    <div style="display:flex;gap:8px;margin-top:10px;">
                        <a href="/post/${r.target_type==='post'?r.target_id:''}" class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;" onclick="${r.target_type!=='post'?'event.preventDefault();showToast(\'仅帖子可跳转查看\');':''}">查看</a>
                        <button class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;color:var(--danger);" onclick="handleReportAdmin(${r.id},'approved')">确认违规</button>
                        <button class="btn btn-ghost btn-sm" style="padding:3px 12px;font-size:0.75rem;" onclick="handleReportAdmin(${r.id},'rejected')">驳回</button>
                    </div>
                </div>
            `).join('');
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'announcements') {
        api.get('/api/admin/announcements').then(list => {
            content.innerHTML = `
                <div style="margin-bottom:20px;">
                    <button class="btn btn-primary" onclick="openCreateAnnouncement()"><i data-lucide="plus-circle" class="icon icon-sm"></i> 发布公告</button>
                </div>
                <div id="announcementList">
                    ${!list.length ? '<div class="empty-state">暂无公告</div>' : list.map(a => `
                        <div class="post-card" style="padding:16px;margin-bottom:12px;">
                            <div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:1.2rem;"><i data-lucide="megaphone" class="icon"></i></span>
                                <div style="flex:1;">
                                    <div style="font-weight:700;font-size:0.95rem;">${escHtml(a.title)}</div>
                                    <div style="font-size:0.8rem;color:var(--text-muted);margin-top:2px;">${formatTime(a.created_at)} · 发布者: ${escHtml(a.creator_name||'系统')}</div>
                                    <p style="font-size:0.85rem;color:var(--text-secondary);margin-top:6px;white-space:pre-wrap;">${escHtml(a.content||'')}</p>
                                </div>
                                <div style="display:flex;flex-direction:column;gap:6px;">
                                    <span class="tag ${a.is_active ? '' : 'tag-muted'}" style="justify-content:center;">${a.is_active ? '<i data-lucide="eye" class="icon icon-sm"></i> 显示中' : '<i data-lucide="eye-off" class="icon icon-sm"></i> 已隐藏'}</span>
                                    <button class="btn btn-ghost btn-sm" style="padding:3px 10px;font-size:0.7rem;" onclick="toggleAnnouncement(${a.id},${a.is_active?0:1})">${a.is_active?'隐藏':'显示'}</button>
                                    <button class="btn btn-ghost btn-sm" style="padding:3px 10px;font-size:0.7rem;color:var(--danger);" onclick="deleteAnnouncement(${a.id})">删除</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'logs') {
        api.get('/api/admin/logs').then(logs => {
            if (!logs.length) { content.innerHTML = '<div class="empty-state">暂无日志</div>'; return; }
            content.innerHTML = logs.map(l => `
                <div style="padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.05);font-size:0.85rem;">
                    <span style="font-weight:600;">${escHtml(l.admin_name||'系统')}</span>
                    <span style="color:var(--pink-4);"> ${escHtml(l.action)} </span>
                    <span style="color:var(--text-secondary);">${escHtml(l.target_type)} #${l.target_id}</span>
                    <span style="font-size:0.7rem;color:var(--text-muted);margin-left:8px;">${formatTime(l.created_at)}</span>
                    ${l.detail ? '<div style="font-size:0.75rem;color:var(--text-muted);margin-top:2px;">'+escHtml(l.detail)+'</div>' : ''}
                </div>
            `).join('');
        });
    } else if (tab === 'topics') {
        api.get('/api/admin/topics').then(list => {
            if (!list.length) { content.innerHTML = '<div class="empty-state">暂无话题</div>'; return; }
            content.innerHTML = `
                <div style="overflow-x:auto;">
                <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                    <tr style="background:var(--pink-1);"><th style="padding:8px;text-align:left;">ID</th><th style="text-align:left;">话题</th><th style="text-align:left;">累计使用</th><th style="text-align:left;">当前关联帖</th><th style="text-align:left;">操作</th></tr>
                    ${list.map(t => `
                        <tr style="border-bottom:1px solid var(--border-primary);">
                            <td style="padding:8px;">${t.id}</td>
                            <td><a class="topic-chip" href="/search?topic=${encodeURIComponent(t.name)}" target="_blank"># ${escHtml(t.name)}</a></td>
                            <td>${t.use_count}</td>
                            <td>${t.live_posts}</td>
                            <td><button class="btn btn-sm" style="color:var(--danger);padding:3px 10px;font-size:0.72rem;" onclick="adminDeleteTopic(${t.id},'${escHtml(t.name)}')"><i data-lucide="trash-2" class="icon icon-sm"></i> 删除</button></td>
                        </tr>`).join('')}
                </table></div>`;
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'tasks') {
        Promise.all([
            api.get('/api/admin/tasks'),
            api.get('/api/admin/tasks/claims')
        ]).then(([tasks, claims]) => {
            const claimsHtml = claims.length ? `
                <h4 style="margin:18px 0 8px;color:var(--pink-4);"><i data-lucide="inbox" class="icon icon-sm"></i> 待审核提交 (${claims.length})</h4>
                ${claims.map(c => `
                    <div style="display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border-primary);border-radius:10px;margin-bottom:8px;font-size:0.85rem;">
                        <span style="flex:1;"><b>${escHtml(c.username)}</b> → ${escHtml(c.title)}
                            ${c.proof ? '<div style="font-size:0.74rem;color:var(--text-muted);margin-top:2px;">说明：' + escHtml(c.proof) + '</div>' : ''}</span>
                        <span style="font-size:0.72rem;color:var(--text-muted);">+${c.reward_coins}币 +${c.reward_points}分</span>
                        <button class="btn btn-primary btn-sm" onclick="reviewTaskClaim(${c.id},'approve')">通过</button>
                        <button class="btn btn-sm" onclick="reviewTaskClaim(${c.id},'reject')">驳回</button>
                    </div>`).join('')}` : '';
            content.innerHTML = `
                <div class="speech-bubble" style="margin-bottom:16px;">
                    <h4 style="margin:0 0 10px;color:var(--pink-4);"><i data-lucide="target" class="icon icon-sm"></i> 发布官方任务</h4>
                    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
                        <div style="flex:2;min-width:180px;"><label class="form-label">标题</label>
                            <input class="input" id="adminTaskTitle" maxlength="60" placeholder="任务标题"></div>
                        <div style="flex:3;min-width:220px;"><label class="form-label">说明</label>
                            <input class="input" id="adminTaskDesc" maxlength="300"></div>
                        <div style="width:100px;"><label class="form-label">奖励金币</label>
                            <input class="input" type="number" id="adminTaskCoins" value="10" min="0"></div>
                        <div style="width:100px;"><label class="form-label">奖励积分</label>
                            <input class="input" type="number" id="adminTaskPoints" value="5" min="0"></div>
                        <button class="btn btn-primary btn-sm" onclick="createAdminTask()"><i data-lucide="check" class="icon icon-sm"></i> 发布</button>
                    </div>
                </div>
                ${claimsHtml}
                <h4 style="margin:18px 0 8px;"><i data-lucide="list" class="icon icon-sm"></i> 全部任务 (${tasks.length})</h4>
                ${tasks.map(t => `
                    <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border-primary);font-size:0.85rem;">
                        <span style="font-size:0.7rem;color:var(--text-muted);">[${t.kind}]</span>
                        <span style="flex:1;">${escHtml(t.title)}</span>
                        <span style="font-size:0.72rem;color:var(--text-muted);">${t.claim_count} 领取 · +${t.reward_coins}币 +${t.reward_points}分</span>
                        <span style="font-size:0.72rem;${t.status === 'active' ? 'color:var(--mint,#1c7c54);' : 'color:var(--text-muted);'}">${t.status === 'active' ? '进行中' : '已关闭'}</span>
                        ${t.status === 'active' ? `<button class="btn btn-sm" style="padding:2px 10px;font-size:0.7rem;" onclick="adminCloseTask(${t.id})">关闭</button>` : ''}
                    </div>`).join('')}`;
            if (window.lucide) lucide.createIcons();
        });
    } else if (tab === 'ads') {
        api.get('/api/site/config').then(cfg => {
            const checked = cfg.ad_enabled ? 'checked' : '';
            content.innerHTML = `
                <div class="speech-bubble" style="max-width:560px;">
                    <h4 style="margin:0 0 12px;color:var(--pink-4);"><i data-lucide="megaphone" class="icon icon-sm"></i> 广告位配置</h4>
                    <p style="font-size:0.78rem;color:var(--text-muted);margin-bottom:14px;">
                        广告位为预留占位：导航下方与页脚上方各一处。默认开启并显示招商文案，可在此关闭或自定义。
                    </p>
                    <label style="display:flex;align-items:center;gap:8px;font-size:0.9rem;margin-bottom:14px;cursor:pointer;">
                        <input type="checkbox" id="adEnabled" ${checked}> <i data-lucide="megaphone" class="icon icon-sm"></i> 显示广告位
                    </label>
                    <div class="form-group"><label class="form-label">顶部广告文案</label>
                        <input class="input" id="adHeader" maxlength="200" value="${escHtml(cfg.ad_header||'')}"></div>
                    <div class="form-group"><label class="form-label">底部广告文案</label>
                        <input class="input" id="adFooter" maxlength="200" value="${escHtml(cfg.ad_footer||'')}"></div>
                    <button class="btn btn-primary" onclick="saveAdConfig()"><i data-lucide="save" class="icon icon-sm"></i> 保存</button>
                </div>`;
            if (window.lucide) lucide.createIcons();
        });
    }
}

function adminDeleteTopic(tid, name) {
    if (!confirm('删除话题「' + name + '」？将解除其与所有帖子的关联。')) return;
    api.delete('/api/admin/topics/' + tid).then(() => { showToast('已删除', 'success'); adminTab('topics'); })
        .catch(err => showToast(err.message || '删除失败', 'error'));
}

function createAdminTask() {
    const title = document.getElementById('adminTaskTitle').value.trim();
    if (!title) return showToast('请填写任务标题', 'error');
    api.post('/api/tasks', {
        kind: 'admin', title,
        description: document.getElementById('adminTaskDesc').value.trim(),
        reward_coins: parseInt(document.getElementById('adminTaskCoins').value, 10) || 0,
        reward_points: parseInt(document.getElementById('adminTaskPoints').value, 10) || 0
    }).then(() => { showToast('任务已发布', 'success'); adminTab('tasks'); })
        .catch(err => showToast(err.message || '发布失败', 'error'));
}

function adminCloseTask(tid) {
    if (!confirm('关闭该任务？已领取者仍可提交。')) return;
    api.post('/api/admin/tasks/' + tid + '/close', {}).then(() => { showToast('已关闭', 'success'); adminTab('tasks'); })
        .catch(err => showToast(err.message || '操作失败', 'error'));
}

function reviewTaskClaim(cid, action) {
    api.post('/api/tasks/claims/' + cid + '/review', { action }).then(res => {
        showToast(res.message || '已处理', 'success'); adminTab('tasks');
    }).catch(err => showToast(err.message || '操作失败', 'error'));
}

function saveAdConfig() {
    const enabled = document.getElementById('adEnabled') ? document.getElementById('adEnabled').checked : true;
    api.put('/api/admin/site/config', {
        ad_enabled: enabled ? '1' : '0',
        ad_header: document.getElementById('adHeader') ? document.getElementById('adHeader').value.trim() : '',
        ad_footer: document.getElementById('adFooter') ? document.getElementById('adFooter').value.trim() : ''
    }).then(() => showToast('已保存，刷新页面生效', 'success')).catch(err => showToast(err.message || '保存失败', 'error'));
}

function setUserField(uid, field, value) {
    const body = {};
    if (field === 'coins' || field === 'points' || field === 'level') value = parseInt(value) || 0;
    body[field] = value;
    api.put('/api/admin/users/' + uid, body).then(() => showToast('已更新', 'success')).catch(e => showToast(e.message, 'error'));
}

function deleteStationAdmin(sid) {
    if (!confirm('确定删除该子站？')) return;
    if (!confirm('再次确认：子站及成员关系将永久删除。')) return;
    api.delete('/api/stations/' + sid).then(() => { showToast('已删除', 'success'); adminTab('stations'); }).catch(e => showToast(e.message, 'error'));
}

function handleReportAdmin(rid, status) {
    const label = status === 'approved' ? '确认违规' : '驳回';
    if (!confirm('确定' + label + '该举报？')) return;
    api.put('/api/reports/' + rid, { status }).then(() => { showToast('已处理', 'success'); adminTab('reports'); }).catch(e => showToast(e.message, 'error'));
}

function reviewPost(pid, action) {
    let note = '';
    if (action === 'reject') {
        note = prompt('驳回原因（可选，将通知作者）：') || '';
    } else if (!confirm('确认通过该帖子？')) return;
    api.post('/api/admin/review', { post_id: pid, action, note })
        .then(d => { showToast(d.message || '已处理', 'success'); adminTab('review'); })
        .catch(e => showToast(e.message, 'error'));
}

function openCreateAnnouncement() {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay show';
    modal.innerHTML = `
        <div class="modal" style="max-width:520px;position:relative;">
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            <div class="modal-title"><i data-lucide="megaphone" class="icon icon-md"></i> 发布公告</div>
            <form onsubmit="createAnnouncement(event,this)">
                <div class="form-group"><label class="form-label">标题</label><input class="input" name="title" required maxlength="100" placeholder="公告标题"></div>
                <div class="form-group"><label class="form-label">内容</label><textarea class="input" name="content" rows="4" maxlength="2000" placeholder="公告内容"></textarea></div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;"><i data-lucide="send" class="icon icon-sm"></i> 发布</button>
            </form>
        </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
    if (window.lucide) lucide.createIcons();
}

function createAnnouncement(e, form) {
    e.preventDefault();
    api.post('/api/admin/announcements', { title: form.title.value.trim(), content: form.content.value.trim() })
        .then(() => { showToast('公告已发布', 'success'); const m = form.closest('.modal-overlay'); if (m) m.remove(); adminTab('announcements'); })
        .catch(err => showToast(err.message || '发布失败', 'error'));
    return false;
}

function toggleAnnouncement(aid, active) {
    api.post('/api/admin/announcements/' + aid + '/toggle', { active: active === 1 })
        .then(() => { showToast('已更新', 'success'); adminTab('announcements'); })
        .catch(e => showToast(e.message, 'error'));
}

function deleteAnnouncement(aid) {
    if (!confirm('确定删除该公告？')) return;
    api.delete('/api/admin/announcements/' + aid)
        .then(() => { showToast('已删除', 'success'); adminTab('announcements'); })
        .catch(e => showToast(e.message, 'error'));
}

function pinPost(pid) {
    api.post('/api/admin/posts/' + pid + '/pin').then(d => showToast(d.message, 'success')).catch(e => showToast(e.message, 'error'));
}

function deletePostAdmin(pid) {
    if (!confirm('确定删除？')) return;
    api.delete('/api/admin/posts/' + pid).then(() => showToast('已删除', 'success')).catch(e => showToast(e.message, 'error'));
}

function openCreateShopItem() {
    const modal = document.createElement('div');
    modal.className = 'modal-overlay show';
    modal.innerHTML = `
        <div class="modal" style="max-width:480px;position:relative;">
            <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">&times;</button>
            <h3 style="font-family:'ZCOOL KuaiLe',cursive;margin-bottom:16px;"><i data-lucide="gift" class="icon icon-sm"></i> 创建商城商品</h3>
            <form onsubmit="createShopItem(event,this)">
                <input class="input" name="name" placeholder="商品名称" required style="margin-bottom:10px;">
                <input class="input" name="description" placeholder="商品描述" style="margin-bottom:10px;">
                <input class="input" name="icon" placeholder="图标（如 medal）" value="gift" style="margin-bottom:10px;">
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <input class="input" name="price_coins" type="number" placeholder="价格(金币)" value="0" style="flex:1;">
                    <input class="input" name="price_points" type="number" placeholder="价格(积分)" value="0" style="flex:1;">
                </div>
                <div style="display:flex;gap:10px;margin-bottom:10px;">
                    <select class="input" name="item_type" style="flex:1;">
                        <option value="badge">徽章</option>
                        <option value="title">称号</option>
                        <option value="rename_card">改名卡</option>
                        <option value="pin_card">置顶卡</option>
                        <option value="anonymity_card">匿名卡</option>
                        <option value="rainbow_name">彩虹昵称</option>
                    </select>
                    <input class="input" name="stock" type="number" placeholder="库存(-1=无限)" value="-1" style="flex:1;">
                </div>
                <div style="display:flex;gap:8px;justify-content:flex-end;">
                    <button type="button" class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    `;
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
    document.body.appendChild(modal);
}

function createShopItem(e, form) {
    e.preventDefault();
    api.post('/api/admin/shop/items', {
        name: form.name.value.trim(),
        description: form.description.value.trim(),
        icon: form.icon.value.trim() || 'gift',
        price_coins: parseInt(form.price_coins.value) || 0,
        price_points: parseInt(form.price_points.value) || 0,
        item_type: form.item_type.value,
        stock: parseInt(form.stock.value) || -1,
        item_data: { type: form.item_type.value }
    }).then(() => {
        showToast('创建成功', 'success');
        const m = form.closest('.modal-overlay'); if (m) m.remove();
        adminTab('shop');
    }).catch(e => showToast(e.message || '创建失败', 'error'));
    return false;
}
</script>
</body>
</html>

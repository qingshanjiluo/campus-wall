<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天室 · 校园墙</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/icons.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <script src="/static/js/api.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/icons.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/animations.js"></script>
    <script src="/static/js/app.js"></script>
</head>
<body>
<div id="app-root">
    <main id="page-main">
        <div class="section" style="padding-top:100px;">
    <div class="container" style="max-width:1100px;">
        <div class="section-header reveal">
            <h2 class="chapter-title"><i data-lucide="message-square" class="icon"></i> 聊天室</h2>
            <p class="chapter-sub">多主题群聊 · @提及同学 · 消息可撤回</p>
        </div>

        <div style="display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;" id="chatLayout">
            <!-- 房间列表 -->
            <div class="reveal">
                <div style="display:flex;gap:8px;margin-bottom:10px;">
                    <button class="btn btn-primary btn-sm" onclick="toggleRoomForm()" style="flex:1;"><i data-lucide="plus" class="icon icon-sm"></i> 新建房间</button>
                </div>
                <div id="roomForm" class="speech-bubble" style="display:none;padding:12px;margin-bottom:10px;">
                    <input class="input" id="roomName" placeholder="房间名（≤40字）" maxlength="40" style="margin-bottom:6px;">
                    <input class="input" id="roomDesc" placeholder="一句话主题" maxlength="200" style="margin-bottom:6px;">
                    <label style="display:flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text-muted);margin-bottom:8px;">
                        <input type="checkbox" id="roomPrivate"> 私有房间（仅受邀成员）
                    </label>
                    <button class="btn btn-primary btn-sm" style="width:100%;" onclick="createRoom()">创建</button>
                </div>
                <div id="roomList"><div class="loading">加载中</div></div>
            </div>

            <!-- 消息区 -->
            <div class="reveal" id="chatPane">
                <div class="empty-state"><div class="icon"><i data-lucide="message-square" class="icon icon-lg"></i></div><div class="text">选择一个房间开始聊天</div></div>
            </div>
        </div>
    </div>
</div>
    </main>
</div>
<script>
let curRoom = null;
let lastMsgId = 0;
let pollTimer = null;

onUserReady(function () {
    loadRooms();
    const want = new URLSearchParams(window.location.search).get('room');
    if (want) openRoom(+want);
});

function loadRooms() {
    api.get('/api/chat/rooms').then(list => {
        const box = document.getElementById('roomList');
        if (!list.length) { box.innerHTML = '<div style="color:var(--text-muted);font-size:0.85rem;">还没有房间，创建一个吧</div>'; return; }
        box.innerHTML = list.map(r => `
            <div class="post-card" style="padding:12px 14px;margin-bottom:8px;cursor:pointer;${curRoom === r.id ? 'border-color:var(--pink-4);' : ''}" onclick="openRoom(${r.id})">
                <div style="display:flex;align-items:center;gap:8px;">
                    <i data-lucide="${escHtml(r.icon || 'message-square')}" class="icon icon-sm"></i>
                    <span style="font-weight:600;font-size:0.9rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(r.name)}</span>
                    ${r.is_public ? '' : '<i data-lucide="lock" class="icon icon-sm" style="color:var(--text-muted);"></i>'}
                </div>
                <div style="font-size:0.72rem;color:var(--text-muted);margin-top:4px;display:flex;gap:10px;">
                    <span><i data-lucide="users" class="icon icon-sm"></i> ${r.member_count}</span>
                    ${r.last_message ? '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;">' + escHtml((r.last_message || '').slice(0, 24)) + '</span>' : ''}
                </div>
            </div>`).join('');
        if (window.lucide) lucide.createIcons();
    });
}

function toggleRoomForm() {
    if (!requireAuth()) return;
    const f = document.getElementById('roomForm');
    f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

function createRoom() {
    if (!requireAuth()) return;
    api.post('/api/chat/rooms', {
        name: document.getElementById('roomName').value.trim(),
        description: document.getElementById('roomDesc').value.trim(),
        is_private: document.getElementById('roomPrivate').checked
    }).then(res => {
        showToast('房间已创建', 'success');
        document.getElementById('roomForm').style.display = 'none';
        loadRooms();
        openRoom(res.id);
    }).catch(err => showToast(err.message || '创建失败', 'error'));
}

function openRoom(id) {
    api.get('/api/chat/rooms/' + id).then(room => {
        curRoom = id;
        lastMsgId = 0;
        loadRooms();
        const pane = document.getElementById('chatPane');
        const joinBar = (!room.is_member && currentUser)
            ? `<div style="padding:10px;text-align:center;background:var(--pink-1);border-radius:12px;margin-bottom:10px;">
                   <span style="font-size:0.85rem;">加入「${escHtml(room.name)}」参与聊天</span>
                   <button class="btn btn-primary btn-sm" style="margin-left:10px;" onclick="joinRoom(${room.id})">加入</button>
               </div>` : '';
        const inputBar = (room.is_member && currentUser) ? `
            <div style="display:flex;gap:8px;margin-top:12px;">
                <input class="input" id="chatInput" placeholder="说点什么… @用户名 可提及" maxlength="1000"
                    onkeydown="if(event.key==='Enter'){event.preventDefault();sendMsg();}">
                <button class="btn btn-primary" onclick="sendMsg()"><i data-lucide="send" class="icon icon-sm"></i></button>
            </div>` : (!currentUser ? '<div style="text-align:center;margin-top:12px;color:var(--text-muted);font-size:0.85rem;">登录后即可参与聊天</div>' : '');
        pane.innerHTML = `
            <div class="post-card" style="padding:0;overflow:hidden;">
                <div style="padding:14px 18px;border-bottom:1px solid var(--border-primary);display:flex;align-items:center;gap:10px;">
                    <i data-lucide="${escHtml(room.icon || 'message-square')}" class="icon"></i>
                    <div style="flex:1;">
                        <div style="font-weight:700;">${escHtml(room.name)}</div>
                        <div style="font-size:0.72rem;color:var(--text-muted);">${escHtml(room.description || '')} · ${room.member_count} 成员 · ${room.message_count} 消息</div>
                    </div>
                    ${room.is_member && room.created_by !== (currentUser && currentUser.id) ? `<button class="btn btn-sm" style="font-size:0.72rem;" onclick="leaveRoom(${room.id})">退出</button>` : ''}
                </div>
                <div id="msgList" style="height:420px;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;"></div>
                ${joinBar}${inputBar}
            </div>`;
        if (window.lucide) lucide.createIcons();
        clearInterval(pollTimer);
        pollTimer = setInterval(() => pollMessages(), 4000);
        loadMessages();
    }).catch(err => showToast(err.message || '房间加载失败', 'error'));
}

function joinRoom(id) {
    api.post('/api/chat/rooms/' + id + '/join', {}).then(() => { showToast('已加入', 'success'); openRoom(id); })
        .catch(err => showToast(err.message || '加入失败', 'error'));
}
function leaveRoom(id) {
    api.post('/api/chat/rooms/' + id + '/leave', {}).then(() => { clearInterval(pollTimer); curRoom = null; document.getElementById('chatPane').innerHTML = '<div class="empty-state"><div class="text">已退出房间</div></div>'; loadRooms(); })
        .catch(err => showToast(err.message || '退出失败', 'error'));
}

function renderMsg(m) {
    const mine = currentUser && m.sender_id === currentUser.id;
    const body = m.is_deleted ? '<i style="color:var(--text-muted);">消息已撤回</i>'
        : renderContent(m.content, false).replace(/@([\w\u4e00-\u9fa5]{1,20})/g,
            '<span style="color:var(--pink-4);font-weight:600;">@$1</span>');
    return `
    <div style="display:flex;gap:8px;align-items:flex-start;${mine ? 'flex-direction:row-reverse;' : ''}">
        <img src="${CampusUtils.safeUrl(m.sender_avatar, '/static/images/default-avatar.svg')}" style="width:30px;height:30px;border-radius:50%;flex-shrink:0;" onerror="this.src='/static/images/default-avatar.svg'">
        <div style="max-width:78%;">
            <div style="font-size:0.68rem;color:var(--text-muted);margin-bottom:2px;${mine ? 'text-align:right;' : ''}">${escHtml(m.sender_name)} · ${formatTime(m.created_at)}</div>
            <div style="background:${mine ? 'var(--pink-1)' : 'var(--bg-tertiary,#f0f0f0)'};border-radius:12px;padding:8px 12px;font-size:0.9rem;line-height:1.5;display:inline-block;">${body}</div>
            ${mine && !m.is_deleted ? `<div style="font-size:0.68rem;margin-top:2px;${mine ? 'text-align:right;' : ''}"><a style="cursor:pointer;color:var(--text-muted);" onclick="recallMsg(${m.id})">撤回</a></div>` : ''}
        </div>
    </div>`;
}

function loadMessages() {
    if (!curRoom) return;
    api.get('/api/chat/rooms/' + curRoom + '/messages?limit=50').then(msgs => {
        const box = document.getElementById('msgList');
        if (!box) return;
        box.innerHTML = msgs.map(renderMsg).join('') || '<div style="color:var(--text-muted);text-align:center;font-size:0.85rem;margin-top:40px;">还没有消息，来发第一条</div>';
        if (msgs.length) lastMsgId = msgs[msgs.length - 1].id;
        box.scrollTop = box.scrollHeight;
        if (window.lucide) lucide.createIcons();
    });
}

function pollMessages() {
    if (!curRoom || document.hidden) return;
    api.get('/api/chat/rooms/' + curRoom + '/messages?after_id=' + lastMsgId + '&limit=50').then(msgs => {
        if (!msgs.length) return;
        const box = document.getElementById('msgList');
        if (!box) return;
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        box.insertAdjacentHTML('beforeend', msgs.map(renderMsg).join(''));
        if (msgs.length) lastMsgId = msgs[msgs.length - 1].id;
        if (nearBottom) box.scrollTop = box.scrollHeight;
    }).catch(() => {});
}

function sendMsg() {
    if (!requireAuth()) return;
    const input = document.getElementById('chatInput');
    const content = input.value.trim();
    if (!content) return;
    api.post('/api/chat/rooms/' + curRoom + '/messages', { content }).then(() => {
        input.value = '';
        pollMessages();
    }).catch(err => showToast(err.message || '发送失败', 'error'));
}

function recallMsg(id) {
    api.delete('/api/chat/messages/' + id).then(() => { showToast('已撤回', 'success'); pollMessages(); })
        .catch(err => showToast(err.message || '撤回失败', 'error'));
}
</script>
</body>
</html>

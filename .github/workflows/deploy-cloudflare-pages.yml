name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - "campus-wall/frontend/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: campus-wall
          directory: campus-wall/frontend
          # 直接上传（Direct Upload）方式，自动带上 frontend/functions + _redirects + _headers
          wranglerVersion: "3"

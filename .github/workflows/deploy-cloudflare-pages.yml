name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - "campus-wall/frontend/**"
  workflow_dispatch: {}

env:
  # Worker API base（KV launch build；升级 D1 后 URL 不变）
  API_BASE_URL: https://campus-wall-api.sifangzhiji.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages production env API_BASE
        continue-on-error: true
        run: |
          A="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"; T="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          P="https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/campus-wall"
          H=(-H "Authorization: Bearer $T" -H 'Content-Type: application/json')
          echo "-- set text env (also normalize preview) --"
          curl -s -X PATCH "$P" "${H[@]}" \
            --data "{\"deployment_configs\":{\"production\":{\"env_vars\":{\"API_BASE\":{\"type\":\"text\",\"value\":\"${API_BASE_URL}\"}}},\"preview\":{\"env_vars\":{\"API_BASE\":{\"type\":\"text\",\"value\":\"${API_BASE_URL}\"}}}}}" \
            | jq -c '{success, errors}'
          echo "-- verify --"
          curl -s "$P" "${H[@]}" | jq -r '.result.deployment_configs.production.env_vars.API_BASE | "type=\(.type) value=\(.value)"'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: campus-wall
          directory: campus-wall/frontend
          # Direct Upload：自动携带 _worker.js（高级控制：/api 反代 + 干净路由 + 404）
          wranglerVersion: "3"

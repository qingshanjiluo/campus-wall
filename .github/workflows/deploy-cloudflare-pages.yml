name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - "campus-wall/frontend/**"
  workflow_dispatch: {}

env:
  # Worker API base（KV launch build；升级 D1 后 URL 不变）
  API_BASE_URL: https://campus-wall-api.sifangzhiji.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Pages production env API_BASE
        run: |
          set -e
          A="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"; T="${{ secrets.CLOUDFLARE_API_TOKEN }}"
          echo "-- PATCH project env --"
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/campus-wall" \
            -H "Authorization: Bearer $T" -H 'Content-Type: application/json' \
            --data "{\"deployment_configs\":{\"production\":{\"env_vars\":{\"API_BASE\":{\"type\":\"text\",\"value\":\"${API_BASE_URL}\"}}}}}" \
            | tee /tmp/resp.json | jq -c '{success, errors}'
          grep -q '"success":true' /tmp/resp.json || { echo "PATCH failed"; cat /tmp/resp.json; exit 1; }
          echo "-- verify --"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/campus-wall" \
            -H "Authorization: Bearer $T" \
            | jq -r '.result.deployment_configs.production.env_vars | if type=="array" then map(select(.name=="API_BASE"))[0].value else (.API_BASE.value // "MISSING") end'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: campus-wall
          directory: campus-wall/frontend
          # Direct Upload：自动携带 functions/ + _redirects + _headers
          wranglerVersion: "3"

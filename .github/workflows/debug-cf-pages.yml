name: Debug CF Pages Topology (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe Pages projects
        run: |
          T="$CLOUDFLARE_API_TOKEN"; A="$CLOUDFLARE_ACCOUNT_ID"
          H=(-H "Authorization: Bearer $T" -H 'Content-Type: application/json')
          echo "-- all pages projects --"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects" "${H[@]}" \
            | jq -r '.result[] | select(.name|test("campus")) | "\(.name) | subdomain=\(.subdomain) | prod_branch=\(.production_branch)"'
          for P in campus-wall campus-wall-673; do
            echo "-- detail: $P (3 recent deployments) --"
            curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/$P/deployments?per_page=3" "${H[@]}" \
              | jq -r '.result[]? | "\(.id) \(.modified_on) branch=\(.deployment_tag.branch // .deployment_environment // "?") env=\(.deployment_environment // "?") url=\(.url) short=\(.short_id)"' || true
          done

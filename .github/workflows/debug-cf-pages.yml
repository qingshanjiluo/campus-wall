name: Debug CF Pages Topology (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Dump Pages project config
        run: |
          T="$CLOUDFLARE_API_TOKEN"; A="$CLOUDFLARE_ACCOUNT_ID"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/campus-wall" \
            -H "Authorization: Bearer $T" \
            | jq '{success, config: {name:.result.name, subdomain:.result.subdomain, production_branch:.result.production_branch, source:(.result.source//.result.deployment_configs.production.deployment_trigger), has_pages_deployments: (.result.has_deployments), prod_env: .result.deployment_configs.production.env_vars, prod_build: {build_cmd:(.result.build_build_command//"n/a")}, preview_env: .result.deployment_configs.preview.env_vars}}'
          echo "-- current production deployment --"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$A/pages/projects/campus-wall/production" \
            -H "Authorization: Bearer $T" \
            | jq '{success, id:.result.id, url:.result.url, created:.result.created_on, env:.result.deployment_config.env_and_secrets | keys}'

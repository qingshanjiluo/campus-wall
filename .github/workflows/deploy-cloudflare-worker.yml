name: Deploy CampusWall Worker (CF Python Worker + D1)

on:
  push:
    branches: [master]
    paths:
      - "backend-worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:
    inputs:
      deploy_kv_experiment:
        description: 'Also deploy KV experiment worker (campus-wall-api-kv)'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ensure workers.dev subdomain
        run: |
          set -e
          RES=$(curl -sf "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || echo '{}')
          SUB=$(echo "$RES" | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            echo "No workers.dev subdomain; creating candidate names..."
            for CAND in campuswall sifangzhiji campus-wall-app cwapp; do
              OK=$(curl -s "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' \
                -X POST --data "{\"subdomain\":\"${CAND}\"}" | jq -r '.success')
              if [ "$OK" = "true" ]; then echo "created subdomain ${CAND}"; break; fi
            done
          else
            echo "workers.dev subdomain: ${SUB}"
          fi

      # D1 步骤全部「宽容」：CI token 可能缺 D1:Edit；即便两步都失败，
      # 部署照常进行 —— bootstrap.ensure_ready() 首请求会自动建表+播种。
      # database_id 固定写在 wrangler.toml（uuid 95ad3424-e78c-4480-ac6b-d675d1f7c3c9）。
      - name: Check D1 database (non-fatal)
        working-directory: backend-worker
        run: |
          if npx --yes wrangler@4.131.2 d1 info campus-wall-db >/dev/null 2>&1; then
            echo "D1 campus-wall-db visible to wrangler ✓"
          else
            echo "::warning::D1 validation failed (token perms?); continuing — bootstrap self-creates tables"
          fi

      - name: Apply D1 migrations (remote, idempotent; non-fatal)
        working-directory: backend-worker
        continue-on-error: true
        run: |
          npx --yes wrangler@4.131.2 d1 execute campus-wall-db --remote --file migrations/0001_init.sql

      # 先部署：冲刷历史遗留的 plain-text JWT_SECRET vars 绑定（否则 secret put 撞 10053）
      - name: Deploy Worker
        working-directory: backend-worker
        run: |
          npx --yes wrangler@4.131.2 deploy
          npx --yes wrangler@4.131.2 deployments list | head -20 || true

      - name: Put JWT secret
        working-directory: backend-worker
        env:
          JWT: ${{ secrets.JWT_SECRET_PROD }}
        run: |
          set -e
          if [ -z "$JWT" ]; then echo "JWT_SECRET_PROD missing" && exit 1; fi
          if ! printf '%s' "$JWT" | npx --yes wrangler@4.131.2 secret put JWT_SECRET 2>/tmp/sec.err; then
            if grep -q 'already in use' /tmp/sec.err; then
              echo "secret exists -> rotate (delete+put)"
              npx --yes wrangler@4.131.2 secret delete JWT_SECRET || true
              printf '%s' "$JWT" | npx --yes wrangler@4.131.2 secret put JWT_SECRET
            else
              cat /tmp/sec.err; exit 1
            fi
          fi

      # ── 可选：KV 实验 worker（仅 workflow_dispatch 且勾选 deploy_kv_experiment）──
      # 放在主部署之后：任何失败都不影响生产 D1 worker 的部署结果。
      - name: Ensure KV namespace (experiment)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_kv_experiment == 'true' }}
        id: kv_exp
        run: |
          set -e
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          HDR=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json')
          KVID=$(curl -s "${API}?per_page=100" "${HDR[@]}" | jq -r '.result[]? | select(.title=="campuswall-kv-experiment") | .id' | head -1)
          if [ -z "$KVID" ]; then
            echo "KV namespace campuswall-kv-experiment not found; creating..."
            KVID=$(curl -s -X POST "${API}" "${HDR[@]}" --data '{"title":"campuswall-kv-experiment"}' | jq -r '.result.id // empty')
          fi
          if [ -z "$KVID" ]; then echo "failed to resolve KV namespace id" && exit 1; fi
          echo "id=$KVID" >> "$GITHUB_OUTPUT"

      - name: Deploy KV experiment worker
        if: ${{ steps.kv_exp.outputs.id != '' }}
        working-directory: backend-worker
        env:
          JWT: ${{ secrets.JWT_SECRET_PROD }}
        run: |
          set -e
          sed -i -E "s|^(# *)?id = .*|\1id = \"${{ steps.kv_exp.outputs.id }}\"|" wrangler.kv.experiment.toml
          grep -n 'id = ' wrangler.kv.experiment.toml
          if [ -n "$JWT" ]; then
            if ! printf '%s' "$JWT" | npx --yes wrangler@4.131.2 secret put JWT_SECRET -c wrangler.kv.experiment.toml 2>/tmp/sec2.err; then
              if grep -q 'already in use' /tmp/sec2.err; then
                npx --yes wrangler@4.131.2 secret delete JWT_SECRET -c wrangler.kv.experiment.toml || true
                printf '%s' "$JWT" | npx --yes wrangler@4.131.2 secret put JWT_SECRET -c wrangler.kv.experiment.toml
              else
                cat /tmp/sec2.err; exit 1
              fi
            fi
          fi
          npx --yes wrangler@4.131.2 deploy -c wrangler.kv.experiment.toml

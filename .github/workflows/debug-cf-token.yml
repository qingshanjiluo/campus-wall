name: Debug CF Token Scope (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe CF API
        run: |
          T="$CLOUDFLARE_API_TOKEN"; A="$CLOUDFLARE_ACCOUNT_ID"
          H=(-H "Authorization: Bearer $T" -H 'Content-Type: application/json')
          echo "-- KV namespace CREATE probe --"
          KVC=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces" "${H[@]}" --data '{"title":"campuswall-probe-del"}')
          echo "$KVC" | jq -c '{success, id: .result.id, errors}' || true
          KVID=$(echo "$KVC" | jq -r '.result.id // empty')
          if [ -n "$KVID" ]; then
            echo "-- KV write probe --"
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces/$KVID/values/probekey" "${H[@]}" --data 'hello' | jq -c '{kv_write: .success}' || true
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces/$KVID" "${H[@]}" | jq -c '{kv_delete: .success}' || true
            echo "(probe KV namespace deleted)"
          fi
          echo "-- Workers script UPLOAD probe (dry, tiny js worker) --"
          cd "$(mktemp -d)"
          printf 'export default{fetch(){return new Response("ok")}}' > worker.mjs
          cat > wrangler.toml <<EOF
name = "campuswall-probe-del"
main = "worker.mjs"
compatibility_date = "2025-01-01"
EOF
          echo "npx wrangler deploy..."
          npx --yes wrangler@4.131.2 deploy 2>&1 | tail -8 || true
          echo "-- cleanup probe worker --"
          curl -s -X DELETE "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts/campuswall-probe-del" "${H[@]}" | jq -c '{del: .success, errors}' || true
          echo "-- Pages project deploy probe (upload a dummy) skipped: already proven working via prior deploy --"
